ay:inline-flex;padding:5px 8px;background:#e0f0e9;color:#155c53;border-radius:99px;font-size:11px;font-weight:700}.axg .wallbox{background:#e9e8e4;color:#233e39;border:1px solid #d9d8d2;border-radius:13px;padding:11px;margin-top:12px}.axg .wall{height:auto;aspect-ratio:2/1;width:100%;position:relative;background:linear-gradient(#fff,#f6f5f1);border:1px solid #a7aea9;overflow:hidden;touch-action:pan-y}.axg .axis{position:absolute;top:0;left:50%;height:100%;border-left:1px dashed #c5cdc7}.axg .work{position:absolute;border:3px solid #444743;box-shadow:1px 2px 4px #0002;overflow:visible;touch-action:none;cursor:grab;background:#e9dfcc;z-index:3}.axg .work.selected{outline:3px solid #118e80;outline-offset:1px;z-index:4}.axg .work:before{content:"";position:absolute;inset:4px;background:linear-gradient(120deg,#e3d7bf 0% 38%,#234453 38% 70%,#b69a67 70%)}.axg .work.n1:before{background:linear-gradient(140deg,#ede1d0 0% 38%,#577c84 38% 73%,#b1ad9a 73%)}.axg .work.n2:before{background:linear-gradient(135deg,#d2bd99 0% 45%,#273d4a 45% 80%,#e6dbbf 80%)}.axg .work span{position:absolute;right:0;bottom:0;padding:1px 3px;font-size:9px;color:#fff;background:#1c3335c9}.axg .measure{position:absolute;pointer-events:none;z-index:2}.axg .overall-h{left:5%;right:5%;top:17px;border-top:1px solid #357e70}.axg .overall-h:before,.axg .overall-h:after{content:"";position:absolute;height:10px;top:-5px;border-left:1px solid #357e70}.axg .overall-h:before{left:0}.axg .overall-h:after{right:0}.axg .wall-label{position:absolute;left:50%;top:-10px;transform:translateX(-50%);background:#f8f8f4;border-radius:4px;padding:1px 5px;white-space:nowrap;color:#135c4f;font-weight:750;font-size:11px}.axg .overall-v{right:38px;top:13%;height:76%;border-left:1px solid #357e70}.axg .overall-v:before,.axg .overall-v:after{content:"";position:absolute;width:9px;left:-5px;border-top:1px solid #357e70}.axg .overall-v:before{top:0}.axg .overall-v:after{bottom:0}.axg .vertical-label{position:absolute;top:50%;left:0;transform:translate(-50%,-50%) rotate(-90deg);transform-origin:center;white-space:nowrap;background:#f8f8f4;border-radius:4px;color:#135c4f;font-size:11px;font-weight:750;padding:3px 5px}.axg .work-size{position:absolute;z-index:2;pointer-events:none;transform:translateX(-50%);background:#f7f7f1ee;border:1px solid #bdd4ca;border-radius:4px;color:#125f52;padding:1px 3px;white-space:nowrap;font-size:10px;font-weight:750}.axg .mid-guide{position:absolute;left:0;right:0;z-index:5;border-top:2px dashed #548b83;pointer-events:none}.axg .mid-guide span{position:absolute;top:-18px;left:4px;background:#f7f7f1e8;border-radius:3px;padding:1px 3px;color:#14695d;font-weight:750;font-size:10px}
/* Only new visual style: Japanese red screw height + neutral gray center height */
.axg .height-guide{position:absolute;left:0;right:0;z-index:2;pointer-events:none;border-top:1px dotted #c63d43}.axg .height-guide.center-guide{border-top:1px dashed #999fa1}.axg .height-guide .dot{position:absolute;left:var(--dotpos,50%);top:-4px;width:7px;height:7px;border:1.5px solid #fff;border-radius:100%;background:#c63d43}
.axg .wall-stage{display:block;width:100%}.axg .wall-stage .wall{width:100%}.axg .height-margin{width:94px;flex:0 0 94px;height:205px;background:#f8f7f3;position:relative;border:1px solid #a7aea9;border-right:0;overflow:hidden}.axg .height-margin .h-note{position:absolute;left:5px;right:3px;transform:translateY(-50%);font-size:10px;line-height:1.18;font-weight:700;pointer-events:none}.axg .height-margin .h-note strong{display:block;font-size:10px}.axg .height-margin .h-note.red{color:#bd373b}.axg .height-margin .h-note.gray{color:#61696e}.axg .height-margin .h-note:after{content:'';position:absolute;left:0;right:-4px;bottom:-4px;border-top:1px dotted currentColor;opacity:.45}
/* Correction ciblée : jauge de hauteur verticale, depuis le sol, comme ArtHang. */
.axg .height-margin .h-note:after{display:none}
.axg .height-margin .h-note.red{transform:translateY(-116%)}
.axg .height-margin .h-note.gray{transform:translateY(16%)}
.axg .height-margin .h-ruler{position:absolute;right:10px;bottom:0;border-left:2px solid #c63d43;pointer-events:none}
.axg .height-margin .h-ruler:before,.axg .height-margin .h-ruler:after{content:'';position:absolute;left:-6px;width:10px;border-top:1.5px solid #c63d43}
.axg .height-margin .h-ruler:before{top:0}.axg .height-margin .h-ruler:after{bottom:0}
.axg .height-margin .h-center-tick{position:absolute;right:5px;width:12px;border-top:1px solid #8b9394;pointer-events:none}

@media(max-width:380px){.axg .height-margin{width:78px;flex-basis:78px;height:170px}.axg .height-margin .h-note{font-size:9px}.axg .height-margin .h-note strong{font-size:9px}}
.axg .metrics{display:flex;gap:4px;align-items:stretch;margin-top:10px}.axg .metric{background:#fff!important;border:1px solid #81b2a4;border-radius:7px;min-width:0;flex:1;text-align:center;color:#145b4f!important;padding:0;font-size:11px;line-height:1.3;font-weight:650}.axg .metric button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:61px;width:100%;border:0;border-radius:7px;padding:7px 1px;background:transparent;color:inherit;font:inherit;cursor:pointer}.axg .metric button:focus-visible{outline:2px solid #2563eb;outline-offset:-2px}.axg .metric.editing{border:2px solid #2563eb;background:#e8f2ff!important}.axg .gap-direct-editor{margin-top:10px;padding:10px;border:1px solid #a8c8e3;background:#f8fbff;border-radius:10px}.axg .gap-direct-editor .row{align-items:flex-end}.axg .gap-direct-editor .field{max-width:145px}.axg .gap-direct-editor .btn{padding:9px 12px}.axg .gap-error{font-size:12px;color:#a13a38;font-weight:650;margin-top:7px}.axg .metric strong{display:block;font-size:15px;font-weight:850;color:#0d5146!important}.axg .metric.bad{background:#fff0ec!important;color:#a33431!important}.axg .metric.bad strong{color:#a33431!important}.axg .gapcontrol{margin:11px 0;padding:11px;border:1px solid var(--bd);border-radius:11px;background:var(--card)}.axg .gapcontrol .row{align-items:end}.axg .gapcontrol .field{max-width:155px}.axg .cards{display:grid;gap:9px;margin:12px 0}.axg .card{border:1px solid var(--bd);border-radius:11px;background:var(--panel);padding:12px}.axg .card.selected{border-color:#248478}.axg .cardtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.axg .pt{font-size:22px;font-weight:800;color:#198476}.axg .drill-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.axg .drill-point{border:1px solid var(--bd);border-radius:10px;padding:12px;background:#f8fbff}.axg .drill-point .small{margin-bottom:8px}.axg .drill-point.single{grid-column:1/-1}.axg .square{background:#faf9f6;border:1px solid #d3d4ce;border-radius:10px;padding:10px;margin-top:10px;color:#244b4b}.axg .foot{border-top:1px solid var(--bd);margin-top:14px;padding-top:11px;font-size:11px;color:var(--mut)}@media(max-width:380px){.axg .metric strong{font-size:12px}.axg .tabs button{font-size:11px}.axg .btn{padding:9px}.axg .drill-grid{gap:8px}}

/* Ciblé : le repère de hauteur est superposé dans le mur, pas une colonne à côté. */
.axg .height-margin{position:absolute;top:0;left:0;height:100%;width:10%;min-width:34px;flex:none;background:transparent;border:0;border-right:0;overflow:visible;pointer-events:none;z-index:5}
.axg .height-margin .h-ruler{right:2px}
.axg .height-margin .h-center-tick{right:-3px}
.axg .height-margin .h-note{left:4px;right:auto;width:32px;max-width:32px;font-size:10px;line-height:1.08;text-shadow:0 1px 0 #f8f7f3}
.axg .height-margin .h-note strong{font-size:10px;white-space:normal}
@media(max-width:380px){.axg .height-margin{height:100%;width:10%;min-width:34px}.axg .height-margin .h-note,.axg .height-margin .h-note strong{font-size:9px}}

/* Seulement les deux cotes générales : au-dessus et à droite du contour du mur. */
.axg .wall-stage{position:relative;margin-top:29px;width:calc(100% - 25px)}
.axg .wall-stage>.overall-h{left:0;right:0;top:-21px;z-index:6}
.axg .wall-stage>.overall-v{right:-22px;top:0;height:100%;z-index:6}

/* Addition limitée à l'onglet Œuvres : photo et affichage sur le mur. */
.axg .work.has-photo:before{display:none}
.axg .work .art-image{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#f4f0e7;pointer-events:none}
.axg .photo-preview{width:100%;max-width:170px;max-height:150px;object-fit:contain;background:#f4f0e7;border:1px solid var(--bd);border-radius:7px;display:block;margin:9px 0}
.axg .photo-picker{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.axg .photo-picker label{display:inline-flex;align-items:center;cursor:pointer}
.axg .photo-picker input[type=file]{position:absolute;width:1px;height:1px;padding:0;opacity:0;overflow:hidden}
.axg .work-edit-top{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:14px;align-items:start;margin-top:6px}
.axg .work-dims-row{align-items:flex-start}
.axg .work-dims-row .field{flex:0 1 145px;max-width:145px;min-width:110px}
.axg .photo-side{border:1px solid var(--bd);border-radius:10px;padding:10px;background:#f8fbff}
.axg .photo-side strong{display:block;margin-bottom:4px}
.axg .photo-side .hint{margin:0 0 6px}
.axg .photo-side .photo-picker{margin-top:8px}
@media(max-width:520px){.axg .work-edit-top{grid-template-columns:1fr}.axg .work-dims-row .field{max-width:none;flex:1 1 120px}.axg .plan-row.align{grid-template-columns:repeat(3,minmax(0,1fr))}.axg .plan-row.heights{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Sélecteur multi-murs : commandes compactes en haut du plan. */
.axg .wall-switch{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:8px;margin:4px 0 13px}
.axg .wall-switch label{font-size:12px;font-weight:700;color:#415a75;display:block}
.axg .wall-switch select{width:100%;margin-top:5px;border:1px solid #b8cadc;border-radius:9px;min-height:41px;padding:9px;color:#20314a;background:#fff;font:inherit}
.axg .wall-switch .btn{min-height:41px;white-space:nowrap}
@media(max-width:380px){.axg .wall-switch{gap:6px}.axg .wall-switch .btn{padding-inline:9px}}

/* Import de plan de référence (image/photo/PDF) : aucun calcul automatique. */
.axg .wall-tools{display:flex;align-items:end;gap:6px}
.axg .wall-tools .btn{padding:10px 9px}
.axg .import-choices{display:flex;gap:7px;flex-wrap:wrap;margin:-4px 0 11px}
.axg .import-choices label{display:inline-flex;align-items:center;cursor:pointer}
.axg .import-choices input[type=file]{position:absolute;width:1px;height:1px;padding:0;opacity:0;overflow:hidden}
.axg .import-reference{margin:-2px 0 12px;padding:9px;border:1px solid #bbcedd;border-radius:10px;background:#fff}
.axg .import-reference .import-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.axg .import-reference .import-head .import-name{font-size:12px;flex:1;min-width:90px;overflow-wrap:anywhere;color:#324f70}
.axg .import-reference .btn{padding:6px 9px;font-size:11px}
.axg .import-reference img{display:block;width:auto;max-width:100%;max-height:330px;object-fit:contain;margin:9px auto 2px;border:1px solid var(--bd);border-radius:7px}
.axg .import-reference .import-info{font-size:11px;color:var(--mut);margin:7px 2px 0}
@media(max-width:390px){.axg .wall-tools .btn{padding:9px 6px;font-size:11px}.axg .wall-switch{gap:5px}}
/* Palette claire : reprise de Ridfou Expo existant, sans toucher à ses fonctionnalités. */
:root{color-scheme:light!important}
body{background:#f8f2e8!important;color:#183150!important}
.axg{color:#20314a!important;--ac:#2563eb;--bd:#c8d8e7;--mut:#60738a;--panel:#ffffff;--card:#eaf1f8}
.axg .brand{color:#183f68}
.axg .tag{color:#63758b}
.axg .tabs{background:#e7eff8;border-color:#c9d8e7}
.axg .tabs button{color:#536b84}
.axg .tabs button.sel{background:#ffffff!important;color:#1b568e!important;box-shadow:0 1px 4px #245d9a22}
.axg input,.axg select,.axg textarea{background:#ffffff!important;color:#20314a!important;border-color:#b8cadc!important}
.axg input::placeholder{color:#8a9bae}
.axg .field label{color:#435d77}
.axg .btn{background:#ffffff!important;color:#244461!important;border-color:#b7cbdd!important}
.axg .btn.primary{background:#2563eb!important;color:white!important;border-color:#2563eb!important}
.axg .btn.active{background:#e2f2ec!important;color:#155f55!important;border-color:#98cabc!important}
.axg .btn.danger{background:#fff7f6!important;color:#a53f3b!important;border-color:#d8a29b!important}
.axg .card,.axg .gapcontrol{background:#ffffff!important;border-color:#d0deeb!important}
.axg .card.selected{border-color:#367dc1!important;box-shadow:inset 0 0 0 1px #b6d4ef}
.axg .pt{color:#1a609c!important}
.axg .pill{background:#e4f0fb;color:#235d91}
.axg .wallbox{background:#f4f4f1!important}
.axg .hint,.axg .small,.axg .foot{color:#647891!important}
.axg .foot{border-top-color:#cbd8e6}
.axg button:focus-visible,.axg input:focus-visible{outline:2px solid #4393dd;outline-offset:2px}

/* Import intelligent : propositions vérifiables, sans écraser les murs existants. */
.axg .recognition{margin-top:10px;border:1px solid #b8cadc;border-radius:12px;background:#fff;padding:12px}
.axg .recognition-head{display:flex;justify-content:space-between;gap:8px;align-items:start;flex-wrap:wrap}
.axg .recognition-head strong{color:#1c4771}
.axg .recognition-status{font-size:12px;color:#5a718a;margin:6px 0}
.axg .wall-count-found{display:grid;gap:4px;border:1px solid #a3cbb9;background:#eef8f2;border-radius:10px;padding:10px;color:#225e49;margin:10px 0}
.axg .wall-count-found strong{font-size:15px}.axg .wall-count-found span{font-size:12px}.axg .wall-count-found small{font-size:11px;line-height:1.4;color:#496b5a}
.axg .recognition-list{display:grid;gap:8px;margin-top:9px}
.axg .recognition-item{display:grid;grid-template-columns:28px minmax(0,1fr) 100px;align-items:center;gap:8px;border:1px solid #d1dfec;border-radius:9px;padding:9px;background:#f8fbff}
.axg .recognition-item .recognition-check{width:18px;height:18px;accent-color:#2563eb;cursor:pointer}
.axg .recognition-item .recognition-label{display:block;font-size:13px;font-weight:750;color:#2b4b69}
.axg .recognition-item .recognition-proof{display:block;font-size:11px;color:#667c90;line-height:1.35;margin-top:3px}
.axg .recognition-item .recognition-unit{font-size:11px;color:#4f6a84;display:block;margin-bottom:2px}
.axg .recognition-item input[type=number]{font-size:14px;padding:7px;max-width:100%;background:#fff!important}
.axg .recognition-warning{font-size:12px;line-height:1.45;color:#94602b;margin-top:8px}
.axg .recognition-error{font-size:12px;font-weight:650;color:#a53f3b;margin-top:7px}
.axg .recognition-btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
@media(max-width:380px){.axg .recognition-item{grid-template-columns:20px minmax(0,1fr) 82px;gap:5px;padding:6px}}

/* Attaches : ordre 1, 2, 3, 4, Rail, visibles sur une seule ligne. */
.axg .attach-points{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:12px 0;align-items:stretch}
.axg .attach-points .btn{min-width:0;white-space:nowrap;padding:10px 2px;font-size:11px;text-align:center}
@media(max-width:380px){.axg .attach-points{gap:3px}.axg .attach-points .btn{font-size:10px;padding:9px 1px}}

/* Ridfou Expo : points sur plan, mode chantier, export papier/PDF - ajouts ciblés */
.axg .art-fix{position:absolute;z-index:8;display:flex;align-items:center;justify-content:center;width:12px;height:12px;transform:translate(-50%,-50%);border-radius:50%;border:1.5px solid #fff;background:#ce3c48;color:#fff;font-size:12px;font-weight:850;line-height:1;box-shadow:0 0 0 1px #b22e3c;pointer-events:none}
.axg .art-fix.unconfirmed{background:#f9f5e5;border:2px dashed #b8752f;box-shadow:none;color:#99571a}
.axg .drill-help{font-size:11px;color:var(--mut);line-height:1.5;margin:5px 0}
.axg .art-cleat{position:absolute;z-index:6;box-sizing:border-box;border:1.5px dashed #2b62a6;background:rgba(80,120,170,.20);pointer-events:none}
.axg .rail-panel{margin:12px 0 4px;padding:11px;border:1px solid #c9d8e6;border-radius:12px;background:#f6f9fc}
.axg .rail-panel>strong{display:block;font-size:13px;color:#254e72;margin-bottom:3px}
.axg .rail-panel .row{margin-top:9px}
.axg .rail-panel .hint{margin:7px 0 0}
.axg .rail-need label{color:#8a5a12}
.axg .rail-need input{border-color:#d3a45b!important;background:#fffaf0!important}
.axg .rail-summary{margin-top:10px;padding:9px 10px;border-radius:9px;background:#fff;border:1px solid #d5e1ec;font-size:12.5px;line-height:1.55;color:#2d4358}
.axg .rail-summary b{color:#165e9b}
.axg .rail-legend{font-size:11.5px;color:#586d82;line-height:1.5;margin-top:4px}
.axg .rail-legend i{display:inline-block;width:14px;height:8px;margin:0 3px 0 6px;vertical-align:-1px;border:1.5px solid #6b777c;background:#c9cfd1;box-sizing:border-box}
.axg .rail-legend i.wall{border:1.5px dashed #2b62a6;background:rgba(80,120,170,.2)}
.axg .drill-points{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0}
.axg .drill-points .drill-point{min-width:0}
.axg .drill-points .drill-point .small{margin-bottom:5px}

<div id="acc-expo-height" class="axg">
<div class="bar"><div class="brand">▣ Ridfou Expo</div><span class="tag">Ridfou Expo</span></div>
<div class="tabs"><button data-tab="plan" class="sel">▣ Mur</button><button data-tab="works">▧ Œuvres</button><button data-tab="attach">⌁ Attaches</button><button data-tab="drill">⊕ Perçage</button><button data-tab="calc">∑ Calculs</button></div>
<div id="axg-screen"></div>
<div class="foot">La hauteur au sol est facultative. Les distances et calculs horizontaux fonctionnent sans elle. Prototype de démonstration. Les données sont enregistrées sur cet appareil : exporte une sauvegarde depuis l’onglet Mur.</div>
</div>
<script>
(function(){
const root=document.getElementById('acc-expo-height');if(!root||root.dataset.started)return;root.dataset.started='1';
const out=root.querySelector('#axg-screen');
// Sauvegarde locale de la V1 : dimensions, emplacements, attaches et photos.
// IndexedDB accepte de grandes photos compressées, contrairement à localStorage.
const PWA_DB='AccrocheExpoV1';
const PWA_STORE='project';
const PWA_KEY='current';
let pwaDb=null, pwaLoaded=false, pwaSaveTimer=null;
function pwaOpen(){
 return new Promise(resolve=>{
  if(!('indexedDB' in window)){resolve(null);return}
  try{
   const request=indexedDB.open(PWA_DB,1);
   request.onupgradeneeded=()=>{
    const db=request.result;
    if(!db.objectStoreNames.contains(PWA_STORE))db.createObjectStore(PWA_STORE);
   };
   request.onsuccess=()=>resolve(request.result);
   request.onerror=()=>resolve(null);
   request.onblocked=()=>resolve(null);
  }catch(_){resolve(null)}
 });
}
function pwaRead(db){
 return new Promise(resolve=>{
  if(!db){try{resolve(JSON.parse(localStorage.getItem(PWA_DB)||'null'))}catch(_){resolve(null)}return}
  try{
   const request=db.transaction(PWA_STORE,'readonly').objectStore(PWA_STORE).get(PWA_KEY);
   request.onsuccess=()=>resolve(request.result||null);
   request.onerror=()=>resolve(null);
  }catch(_){resolve(null)}
 });
}
function pwaSnapshot(){
 // Ignore la confirmation de suppression, qui n'est pas une donnée du projet.
 syncActiveWall();return {...s,deleteId:null,calc:rfCalcSnapshot()};
}
function pwaWrite(){
 if(!pwaLoaded)return;
 if(pwaSaveTimer!==null){clearTimeout(pwaSaveTimer);pwaSaveTimer=null}
 const state=pwaSnapshot();
 if(pwaDb){
  try{pwaDb.transaction(PWA_STORE,'readwrite').objectStore(PWA_STORE).put(state,PWA_KEY)}
  catch(_){/* possibilité de stockage indisponible, garder la session courante */}
 }else{
  try{localStorage.setItem(PWA_DB,JSON.stringify(state))}catch(_){/* stockage local limité */}
 }
}
function pwaSave(){
 if(!pwaLoaded)return;
 if(pwaSaveTimer!==null)clearTimeout(pwaSaveTimer);
 pwaSaveTimer=setTimeout(pwaWrite,120);
}
function pwaStart(){
 pwaOpen().then(async db=>{
  pwaDb=db;
  const prev=await pwaRead(db);
  if(prev&&typeof prev==='object'&&Array.isArray(prev.arts)&&Number.isFinite(prev.wallW)&&Number.isFinite(prev.wallH)){
   const allowed=['showFixings','wallW','wallH','desiredGap','gapOpen','heightOpen','centerOpen','centerHeight','centerScope','bottomOpen','bottomHeight','bottomScope','selected','arts','importedPlan'];
   for(const key of allowed){if(Object.prototype.hasOwnProperty.call(prev,key))s[key]=prev[key]}
   s.cleat=cleanCleat(prev.cleat);
   if(!s.arts.some(a=>a.id===s.selected))s.selected=s.arts[0]?.id??null;
   if(Array.isArray(prev.walls)&&prev.walls.length){
    s.walls=prev.walls.filter(w=>w&&w.id&&Array.isArray(w.arts)&&Number.isFinite(w.wallW)&&Number.isFinite(w.wallH));
    const chosen=s.walls.find(w=>w.id===prev.currentWallId)||s.walls[0];
    if(chosen)loadWall(chosen);
   }
  }
  if(prev&&prev.calc)rfCalcRestore(prev.calc);
  if(!s.walls.length){s.currentWallId='A';s.walls=[wallFromActive('A','Mur A')];}
  s.tab='plan';s.deleteId=null;
  pwaLoaded=true;
  draw();
 }).catch(()=>{pwaLoaded=true;draw()});
}
window.addEventListener('pagehide',pwaWrite);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')pwaWrite()});
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}

const s={walls:[],currentWallId:'A',tab:'plan',wallW:600,wallH:300,desiredGap:10,gapOpen:false,heightOpen:false,centerOpen:false,centerHeight:150,centerScope:'all',bottomOpen:false,bottomHeight:110,bottomScope:'one',showFixings:true,siteMode:false,selected:1,deleteId:null,importedPlan:null,cleat:{h:5,end:5,gap:40,d:''},arts:[
{id:1,name:'Œuvre 1',w:65,h:95,x:70,y:92,edge:12,top:8,points:2},
{id:2,name:'Œuvre 2',w:100,h:135,x:210,y:71,edge:15,top:10,points:2},
{id:3,name:'Œuvre 3',w:65,h:95,x:390,y:92,edge:12,top:8,points:2}
]};

// Compatibilité : les données existantes deviennent « Mur A » sans être effacées.
const WALL_KEYS=['showFixings','wallW','wallH','desiredGap','heightOpen','centerOpen','centerHeight','centerScope','bottomOpen','bottomHeight','bottomScope','selected','arts','importedPlan'];
function wallFromActive(id,name){
 const w={id,name};for(const k of WALL_KEYS)w[k]=s[k];return w;
}
function syncActiveWall(){
 if(!s.walls.length)return;
 const wall=s.walls.find(w=>w.id===s.currentWallId);
 if(!wall)return;
 for(const key of WALL_KEYS)wall[key]=s[key];
}
function loadWall(w){
 if(!w)return;
 s.currentWallId=w.id;
 for(const key of WALL_KEYS){if(Object.prototype.hasOwnProperty.call(w,key))s[key]=w[key];}
 s.importedPlan=w.importedPlan||null;
 s.selected=s.arts.some(a=>a.id===s.selected)?s.selected:(s.arts[0]?.id??null);
 s.centerOpen=false;s.bottomOpen=false;s.gapOpen=false;s.siteMode=false;importChoicesOpen=false;importPreviewOpen=false;measureReset();
 editGapIndex=-1;gapError='';
 rfCalc.hArt=rfCalc.wArt='';rfCalc.note='';
}
function chooseWall(id){
 pendingDeleteWallId=null;syncActiveWall();const wall=s.walls.find(w=>w.id===id);
 if(wall){loadWall(wall);s.tab='plan';draw();}
}
function removeSelectedWall(){
 // Ne jamais supprimer le dernier mur. Conserver les autres murs et leurs œuvres.
 if(s.walls.length<=1||pendingDeleteWallId!==s.currentWallId)return;
 const at=s.walls.findIndex(w=>w.id===s.currentWallId);
 if(at<0)return;
 s.walls.splice(at,1);
 pendingDeleteWallId=null;
 const next=s.walls[Math.min(at,s.walls.length-1)];
 loadWall(next);
 s.tab='plan';
 draw();
}
function addWall(width,stay){
 syncActiveWall();let index=0,id;
 do{id=String.fromCharCode(65+index);index++;}while(s.walls.some(w=>w.id===id)&&index<26);
 if(s.walls.some(w=>w.id===id)){alert('Maximum de 26 murs pour cette version.');return;}
 const newWall={id,name:`Mur ${id}`,wallW:Number.isFinite(width)?width:600,wallH:300,desiredGap:10,showFixings:true,heightOpen:false,centerOpen:false,centerHeight:150,centerScope:'all',bottomOpen:false,bottomHeight:110,bottomScope:'one',selected:null,arts:[],importedPlan:null};
 s.walls.push(newWall);if(stay)return newWall;loadWall(newWall);s.tab='plan';draw();return newWall;
}
let importChoicesOpen=false,importPreviewOpen=false;
// Confirmation de suppression limitée au mur sélectionné (non sauvegardée).
let pendingDeleteWallId=null;
const safeText=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Détection locale : les propositions ne remplacent jamais un mur sans validation.
let recognitionBusy=false;
let recognitionError='';
function formatCandidateCm(n){return Number.isFinite(Number(n))&&n!==''?Number(n).toFixed(1).replace(/\.0$/,''):'';}
function renderRecognition(p){
 if(p?.kind==='image')return '';const r=p?.analysis;if(!r)return `<div class="recognition-status">Analyse possible : lecture des cotes du PDF. À vérifier.</div>`;
 if(r.state==='loading')return `<div class="recognition-status" role="status">Analyse du plan en cours…</div>`;
 const arr=Array.isArray(r.candidates)?r.candidates:[];
 return `<section class="recognition" aria-label="Murs proposés par l'analyse">
 <div class="recognition-head"><strong>Longueurs proposées depuis le plan</strong><span class="pill">À vérifier</span></div>
 <p class="recognition-status">${safeText(r.message||'Vérifie les dimensions avant de créer des murs.')}</p>
 ${Number.isInteger(r.declaredWallCount)&&r.declaredWallCount>0?`<div class="wall-count-found"><strong>${r.declaredWallCount} murs indiqués dans le document</strong><span>Source : « ${safeText(r.declaredCountEvidence)} »</span><small>Nombre relevé dans le texte du PDF, et non déduit du nombre de traits. Les dimensions restent à vérifier.</small></div>`:`<p class="recognition-status">Le nombre exact de murs n'est pas indiqué clairement dans le texte reconnu. Les propositions de longueur ne suffisent pas à le garantir.</p>`}
 ${arr.length?`<div class="recognition-list">${arr.map((c,i)=>`<div class="recognition-item">
 <input type="checkbox" class="recognition-check" data-candidate-check="${i}" ${c.checked?'checked':''} aria-label="Créer ${safeText(c.label)}">

async function parsePdfPlan(file){

   // n'est pas reconnue, cette méthode ne prétend pas extraire le texte.

  // de cotes à chaque paroi reste incertaine. Ne créer jamais en silence.

  for(let i=0;i<declaredWallCount;i++){

   candidates.push({label:`Mur ${i+1} — à identifier`,cm:p?p.cm:'',
    evidence:p?`${p.label}. ${p.evidence}`:'Aucune longueur fiable associée à cette paroi : mesure à renseigner.',checked:true});
  }
  return {state:'ready',declaredWallCount,declaredCountEvidence,candidates,
   message:`Le document indique ${declaredWallCount} mur(s). J'ai proposé ${declaredWallCount} fiches de mur. Vérifie leurs dimensions et leur correspondance sur le dessin avant création.`};

}

  if(g.top+g.c.h>a.h)messages.push('Rail : le tasseau (haut à '+f(g.top)+' cm, hauteur '+f(g.c.h)+' cm) dépasse le bas de l’œuvre.');
 }
 return messages;
}
function fixingMarkup(a){
 if(s.showFixings===false)return '';
 let bar='';
 if(a.points==='rail'){const g=cleatGeom(a);if(g.wallTopOffset!==null)bar=`<span class="art-cleat" style="left:${(g.x1-a.x)/a.w*100}%;top:${g.wallTopOffset/a.h*100}%;width:${g.L/a.w*100}%;height:${g.c.h/a.h*100}%" aria-hidden="true" title="Tasseau mural"></span>`}

  return `<span class="art-fix ${p.offset===null?'unconfirmed':''}" style="left:${x}%;top:${y}%" aria-hidden="true" title="${safeText(p.name)}">${p.offset===null?'?':'+'}</span>`;
 }).join('');
}

const cap=a=>{a.w=Math.max(1,a.w);a.h=Math.max(1,a.h);a.x=Math.min(Math.max(0,a.x),Math.max(0,s.wallW-a.w));a.y=Math.min(Math.max(0,a.y),Math.max(0,s.wallH-a.h));a.edge=Math.min(Math.max(0,a.edge),a.w/2)};
const field=(title,key,value)=>`<div class="field"><label>${title}</label><input type="number" data-key="${key}" value="${fv(value)}" min="0" step="0.1"></div>`;

function layout(){const aa=[...s.arts].sort((a,b)=>a.x-b.x);let x=0,gaps=[];for(const a of aa){gaps.push({n:a.x-x});x=a.x+a.w}gaps.push({n:s.wallW-x});return{aa,gaps}}
function heightMargin(){

function gapPanel(){return `<div class="gapcontrol"><strong>↔ Écart précis entre les œuvres</strong><div class="row" style="margin-top:9px"><div class="field"><label>Écart souhaité (cm)</label><input type="number" data-key="desiredGap" min="0" step="0.1" value="${fv(s.desiredGap)}"></div><button class="btn primary" data-act="applyGap">Appliquer l’écart</button></div><div class="actions" style="margin:8px 0 0"><button class="btn" data-act="presetGap" data-id="10">10 cm</button><button class="btn" data-act="presetGap" data-id="15">15 cm</button></div><p class="hint" style="margin-bottom:0">Écart identique entre les cadres. L’ensemble des œuvres est centré horizontalement sur le mur.</p></div>`}
function centerPanel(){const selected=art();return `<div class="gapcontrol"><strong>Milieu à une hauteur précise — depuis le sol</strong><div class="row" style="margin-top:9px"><div class="field"><label>Hauteur du milieu (cm)</label><input type="number" data-center-height min="0" max="${fv(s.wallH)}" step="0.1" value="${fv(s.centerHeight)}"></div></div><div style="display:grid;gap:9px;margin-top:11px;font-size:12px"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="radio" name="centerScope" value="one" ${s.centerScope==='one'?'checked':''} style="width:auto;margin:0;accent-color:#19756b"> Œuvre sélectionnée${selected?' ('+safeText(selected.name)+')':''}</label><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="radio" name="centerScope" value="all" ${s.centerScope==='all'?'checked':''} style="width:auto;margin:0;accent-color:#19756b"> Toutes les œuvres du mur</label></div><div class="actions"><button class="btn primary" data-act="applyCenter">Appliquer la hauteur</button></div><p class="hint" style="margin-bottom:0">Seules les positions verticales changent. Les espaces horizontaux restent identiques.</p></div>`}
function bottomPanel(){const selected=art();return `<div class="gapcontrol"><strong>Bas à une hauteur précise — depuis le sol</strong><div class="row" style="margin-top:9px"><div class="field"><label>Hauteur du bas de l’œuvre (cm)</label><input type="number" data-bottom-height min="0" max="${fv(s.wallH)}" step="0.1" value="${fv(s.bottomHeight)}"></div></div><div style="display:grid;gap:9px;margin-top:11px;font-size:12px"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="radio" name="bottomScope" value="one" ${s.bottomScope==='one'?'checked':''} style="width:auto;margin:0;accent-color:#19756b"> Œuvre sélectionnée${selected?' ('+safeText(selected.name)+')':''}</label><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="radio" name="bottomScope" value="all" ${s.bottomScope==='all'?'checked':''} style="width:auto;margin:0;accent-color:#19756b"> Toutes les œuvres du mur</label></div><div class="actions"><button class="btn primary" data-act="applyBottom">Appliquer la hauteur</button></div><p class="hint" style="margin-bottom:0">Seules les positions verticales changent. Les espaces horizontaux restent identiques.</p></div>`}
// Hauteur d'affichage plafonnée (≈480 px) sur grand écran, sans jamais déformer le mur.
function stageStyle(){const w=Math.round(480*s.wallW/s.wallH);return `max-width:${w}px;margin-left:max(0px,calc((100% - 25px - ${w}px)/2))`}

function plan(){const {gaps}=layout();const active=s.walls.find(w=>w.id===s.currentWallId);return `<div class="bar"><strong>${safeText(active?.name||'Mur A')} — Plan d’exposition</strong><span class="pill">Horizontal prioritaire</span></div>${wallSelector()}<div class="row">${field('Largeur du mur (cm)','wallW',s.wallW)}${field('Hauteur du mur (cm)','wallH',s.wallH)}</div>${overflowNotice()}<div class="wallbox"><div class="bar"><span class="small" style="color:#36544d">Vue de face — ${f(s.wallW)} × ${f(s.wallH)} cm</span><span class="small" style="color:#36544d">À l’échelle</span></div><div class="wall-stage" style="${stageStyle()}"><div class="measure overall-h"><span class="wall-label">${f(s.wallW)} cm</span></div><div class="measure overall-v"><span class="vertical-label">${f(s.wallH)} cm</span></div><div class="wall" id="axg-wall" style="aspect-ratio:${s.wallW} / ${s.wallH}"><div class="axis"></div>${heightMargin()}${dimensions()}${s.arts.map((a,i)=>`<div class="work n${i%3} ${a.id===s.selected?'selected':''} ${a.photo?'has-photo':''}" data-art="${a.id}" style="left:${a.x/s.wallW*100}%;top:${a.y/s.wallH*100}%;width:${a.w/s.wallW*100}%;height:${a.h/s.wallH*100}%">${a.photo?`<img class="art-image" src="${a.photo}" alt="Photo de ${safeText(a.name)}">`:''}<span>${a.id}</span>${fixingMarkup(a)}</div>`).join('')}</div></div><div class="metrics">${(s.arts.length?gaps:[]).map((g,i)=>`<div class="metric ${g.n<0?'bad':''} ${editGapIndex===i?'editing':''}"><button type="button" data-act="editGap" data-gap="${i}" aria-label="Modifier ${gapLabel(i,gaps.length)}, actuellement ${f(g.n)} centimètres"><span>${gapLabel(i,gaps.length)}</span><strong>${f(g.n)} cm</strong></button></div>`).join('')}</div>${s.showFixings!==false&&art()?`<div class="hint" style="color:#b93d46;margin:8px 2px 0;font-weight:650">${safeText(art().name)} · Vis (depuis gauche) : ${holeXs(art()).map(x=>`${f(x)} cm`).join(' · ')}</div>`:''}${!s.arts.length?'<p class="hint">Ce mur est vide. Ajoute ses œuvres dans l’onglet Œuvres.</p>':''}${editGapIndex>=0&&editGapIndex<gaps.length?`<div class="gap-direct-editor" aria-label="Modifier une distance horizontale"><div class="row"><div class="field"><label>${gapLabel(editGapIndex,gaps.length)} (cm)</label><input id="gap-direct-input" type="number" inputmode="decimal" step="0.1" min="0" value="${fv(gaps[editGapIndex].n)}" aria-label="Nouvelle distance pour ${gapLabel(editGapIndex,gaps.length)}"></div><button type="button" class="btn primary" data-act="saveGap">✓ OK</button><button type="button" class="btn" data-act="cancelGap">Annuler</button></div>${gapError?`<div role="alert" class="gap-error">${gapError}</div>`:''}</div>`:''}${s.heightOpen&&art()?'<p class="hint" style="color:#496057;margin:7px 0 0;font-size:11px">Hauteurs calculées depuis le plan de démonstration (positions et attaches préremplies).</p>':''}</div><div class="plan-actions"><div class="plan-row align"><button class="btn" data-act="top">⊤ Aligner haut</button><button class="btn" data-act="center">⊞ Aligner milieu</button><button class="btn" data-act="bottom">⊥ Aligner bas</button></div><div class="plan-row heights"><button class="btn ${s.centerOpen?'active':''}" data-act="toggleCenter" aria-expanded="${s.centerOpen}">↕ Milieu à hauteur…</button><button class="btn ${s.bottomOpen?'active':''}" data-act="toggleBottom" aria-expanded="${s.bottomOpen}">↕ Bas à hauteur…</button></div><div class="plan-row misc"><button class="btn primary" data-act="equal">↔ Espaces égaux</button><button class="btn ${s.heightOpen?'active':''}" data-act="toggleHeight" aria-expanded="${s.heightOpen}">${s.heightOpen?'Masquer la hauteur':'Afficher la hauteur'}</button></div></div>${s.centerOpen?centerPanel():''}${s.bottomOpen?bottomPanel():''}<p class="hint">Déplace les œuvres sur le mur ou touche une cote sous le plan. Les croix rouges indiquent les points d’accrochage ; les « ? » signalent une hauteur à confirmer.</p><div class="row">${art()?`<span class="pill">Œuvre sélectionnée : ${safeText(art().name)}</span><button class="btn" data-act="works">Modifier ses dimensions</button>`:'<span class="pill">Aucune œuvre</span>'}</div>${projectPanel()}`}
function works(){return `<div class="bar"><strong>Mes œuvres</strong><button class="btn primary" data-act="add">＋ Ajouter</button></div><p class="hint">Sélectionne une œuvre pour modifier ses dimensions. Le plan se met à jour.</p>${s.arts.length?`<div class="cards">${s.arts.map(a=>`<div class="card ${s.selected===a.id?'selected':''}"><div class="cardtop"><strong>${safeText(a.name)}</strong><div class="row"><button class="btn ${a.id===s.selected?'active':''}" data-act="select" data-id="${a.id}">${a.id===s.selected?'Sélectionnée':'Choisir'}</button><button class="btn danger" data-act="askDelete" data-id="${a.id}">Supprimer</button></div></div>${s.deleteId===a.id?`<p class="hint">Supprimer ${safeText(a.name)} du mur ?</p><div class="actions"><button class="btn danger" data-act="confirmDelete" data-id="${a.id}">Oui, supprimer</button><button class="btn" data-act="cancelDelete">Annuler</button></div>`:''}${a.id===s.selected?`<div class="work-edit-top"><div class="work-dims"><div class="field name-field"><label for="art-name-${a.id}">Nom de l’œuvre</label><input id="art-name-${a.id}" type="text" maxlength="60" autocomplete="off" data-name-art="${a.id}" value="${safeText(a.name)}"></div><div class="row work-dims-row" style="margin-top:8px">${field('Largeur (cm)','w',a.w)}${field('Hauteur (cm)','h',a.h)}</div><div class="row work-dims-row" style="margin-top:8px"><div class="field"><label>Du bord gauche du mur (cm)</label><input type="number" inputmode="decimal" step="0.1" min="0" data-pos="x" value="${fv(a.x)}"></div><div class="field"><label>Du sol au bas de l’œuvre (cm)</label><input type="number" inputmode="decimal" step="0.1" min="0" data-pos="bottom" value="${fv(s.wallH-a.y-a.h)}"></div></div></div><div class="photo-side"><strong>Photo de l’œuvre</strong>${a.photo?`<img class="photo-preview" src="${a.photo}" alt="Aperçu de ${safeText(a.name)}">`:'<p class="hint">Ajoute la photo de cette œuvre pour la voir sur le mur.</p>'}<div class="photo-picker"><label class="btn" for="photo-camera-${a.id}">📷 Prendre une photo</label><input id="photo-camera-${a.id}" type="file" accept="image/*" capture="environment" data-photo="${a.id}"><label class="btn" for="photo-file-${a.id}">▧ Choisir une photo</label><input id="photo-file-${a.id}" type="file" accept="image/*" data-photo="${a.id}">${a.photo?`<button class="btn" data-act="removePhoto" data-id="${a.id}">Enlever la photo</button>`:''}</div></div></div>`:`<div class="small">${f(a.w)} × ${f(a.h)} cm${a.photo?' · Photo ajoutée':''}</div>`}</div>`).join('')}</div>`:'<p class="hint">Aucune œuvre. Appuie sur « Ajouter » pour recommencer.</p>'}<button class="btn primary" data-act="plan">Voir le plan →</button>`}

// Schéma du rail : tasseau de l'œuvre (gris), tasseau mural (pointillés bleus), vis (croix rouges).
function railSchema(a){
 const g=cleatGeom(a),X0=48,W=144,Y0=18,Hh=115;
 const sx=v=>X0+W*(v-a.x)/a.w,sy=o=>Y0+Hh*o/a.h;
 const bh=Math.max(4,Hh*g.c.h/a.h),bw=Math.max(2,W*g.L/a.w);
 let out=`<rect x="${X0}" y="${Y0}" width="${W}" height="${Hh}" fill="#f4eddf" stroke="#60645d" stroke-width="3"/>`;
 out+=`<rect x="${sx(g.x1)}" y="${sy(g.top)}" width="${bw}" height="${bh}" fill="#c9cfd1" stroke="#7f8b90" stroke-width="1.5"/>`;
 if(g.wallTopOffset!==null){
  out+=`<rect x="${sx(g.x1)}" y="${sy(g.wallTopOffset)}" width="${bw}" height="${bh}" fill="rgba(80,120,170,.18)" stroke="#2b62a6" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  out+=g.xs.map(x=>`<g stroke="#c33c46" stroke-width="2"><circle cx="${sx(x)}" cy="${sy(g.screwOffset)}" r="4.5" fill="#fff"/><path d="M${sx(x)-3} ${sy(g.screwOffset)}h6 M${sx(x)} ${sy(g.screwOffset)-3}v6"/></g>`).join('');
 }
 return `<svg viewBox="0 0 240 145" width="100%" style="max-height:150px" role="img" aria-label="Schéma du rail">${out}</svg>`;
}
function railSummary(a){
 const g=cleatGeom(a),hs=heightsFromPlan(a);
 const base=`Tasseau mural de <b>${f(g.L)} cm</b>, du bord gauche du mur : de <b>${f(g.x1)}</b> à <b>${f(g.x2)} cm</b>. <b>${g.n} vis</b>${g.n>1?`, une tous les <b>${f(g.spacing)} cm</b>`:''}.`;
 if(hs.cleatTop===null)return base+' Hauteur : renseigne l’emboîtement ci-dessus.';
 return base+` Haut du tasseau à <b>${f(hs.cleatTop)} cm</b> du sol ; vis à <b>${f(g.c.h/2)} cm</b> sous ce haut, soit <b>${f(hs.vis)} cm</b> du sol.`;
}
function railPanel(a){
 const c=cleatCfg(),d=s.cleat&&s.cleat.d!==''&&s.cleat.d!==undefined&&s.cleat.d!==null?fv(s.cleat.d):'';
 const fld=(k,label,val,min,max,cls,ph)=>`<div class="field ${cls||''}"><label>${label}</label><input type="number" inputmode="decimal" step="0.1" min="${min}" max="${max}" data-cleat="${k}" value="${val}"${ph?` placeholder="${ph}"`:''}></div>`;
 return `<div class="rail-panel"><strong>Réglages du rail</strong><p class="hint" style="margin:0">Identiques pour toutes les œuvres en rail. Le tasseau mural est fixé par vous, au mur.</p>
 <div class="row">${fld('h','Hauteur du tasseau (cm)',fv(c.h),0.5,50)}${fld('end','Vis : retrait aux bouts (cm)',fv(c.end),0,100)}</div>
 <div class="row">${fld('gap','Écart maxi entre vis (cm)',fv(c.gap),5,300)}${fld('d','Emboîtement (cm)',d,-50,100,d===''?'rail-need':'','À mesurer')}</div>
 <p class="hint">Emboîtement : une fois les deux tasseaux emboîtés (essai sur une table), de combien le haut du tasseau mural est-il plus bas que le haut du tasseau de l’œuvre ? À mesurer une seule fois.</p>
 <div class="rail-summary" id="rail-summary">${railSummary(a)}</div></div>`;
}
function refreshAttachLive(a){
 const svg=out.querySelector('#attach-schema');if(svg)svg.innerHTML=attachSchema(a);
 const sm=out.querySelector('#rail-summary');if(sm&&a.points==='rail')sm.innerHTML=railSummary(a);
}
function attachSchema(a){
 if(a.points==='rail')return railSchema(a);
 const pts=fixingPoints(a);
 const rail=a.points==='rail';
 // Une attache au-dessus du cadre : on laisse de la place au-dessus du dessin.
 const neg=Math.min(0,Number(a.top)||0,...pts.map(p=>p.offset===null?0:p.offset));
 const extra=Math.min(40,-neg/a.h*115),y0=18+extra;
 const shapes=pts.map(p=>{
  const x=48+144*(p.x-a.x)/a.w,y=p.offset===null?y0+95:y0+115*p.offset/a.h;
  return p.offset===null?`<circle cx="${x}" cy="${y}" r="6" fill="#fdf8e8" stroke="#aa722a" stroke-width="2" stroke-dasharray="2 2"/>`:`<g stroke="#c33c46" stroke-width="2"><circle cx="${x}" cy="${y}" r="5" fill="#fff"/><path d="M${x-3} ${y}h6 M${x} ${y-3}v6"/></g>`;
 }).join('');
 const y=y0+115*Math.max(-a.h,Math.min(a.h,Number(a.top)||0))/a.h;
 const railShape=rail?`<rect x="60" y="${y-6}" width="120" height="12" rx="2" fill="#b7c0c3" stroke="#7f8b90"/><text x="120" y="${Math.max(11,y-10)}" text-anchor="middle" font-size="10" fill="#5f6d72">Rail</text>`:'';
 return `<svg viewBox="0 0 240 ${145+extra}" width="100%" style="max-height:${150+extra}px"><rect x="48" y="${y0}" width="144" height="115" fill="#f4eddf" stroke="#60645d" stroke-width="3"/>${railShape}${shapes}</svg>`;
}

function attach(){
 const a=art();if(!a)return '<p class="hint">Aucune œuvre. Ajoute une œuvre dans l’onglet Œuvres.</p>';

 return `<div class="bar"><strong>Attaches — ${safeText(a.name)}</strong><button class="btn" data-act="works">Changer d'œuvre</button></div>
 <div class="card"><span class="small">Nombre de points d’accrochage</span>
 <div class="attach-points">${options.map(p=>`<button class="btn ${p===a.points?'active':''}" data-act="points" data-id="${attachBtnValue(p)}">${attachLabel(p)}</button>`).join('')}</div>
 <div class="row"><div class="field"><label>${isRail?'Du haut de l’œuvre au haut de son tasseau (cm)':a.top<0?'Du bord haut à l’attache, vers le haut (cm)':'Du haut à l’attache (cm)'}</label><input type="number" min="0" step="0.1" inputmode="decimal" data-key="top" value="${fv(Math.abs(a.top))}"></div>${showEdge?field(isRail?'Du bord latéral de l’œuvre au bout du tasseau (cm)':'Du bord latéral à l’attache (cm)','edge',a.edge):''}</div>${isRail?'':`<div class="side-toggle" role="group" aria-label="Position de l’attache par rapport au bord haut"><button type="button" class="btn ${a.top<0?'':'active'}" data-act="topSide" data-id="below">Attache sous le bord haut</button><button type="button" class="btn ${a.top<0?'active':''}" data-act="topSide" data-id="above">Attache au-dessus du cadre</button></div>`}
 ${a.points===4?`<div class="row" style="margin-top:9px"><div class="field"><label>Du bas aux attaches basses (cm) — à renseigner</label><input type="number" min="0" max="${fv(a.h)}" step="0.1" inputmode="decimal" data-key="bottomOffset" placeholder="Non renseigné" value="${a.bottomOffset===undefined||a.bottomOffset===null?'':safeText(a.bottomOffset)}"></div></div>`:''}
 ${isRail?railPanel(a):''}
 <div class="square" style="text-align:center"><div id="attach-schema">${attachSchema(a)}</div>${isRail?'<div class="rail-legend"><i></i>Tasseau de l’œuvre (au dos)<i class="wall"></i>Tasseau mural · croix rouges : vis</div>':'<div class="small">Schéma indicatif : les quatre points sont sur deux rangées</div>'}</div>
 ${fixWarnings(a).map(x=>`<div class="notice-attach">${safeText(x)}</div>`).join('')}</div>
 <div class="actions"><button class="btn primary" data-act="drill">Calculer les perçages →</button></div>`;
}

function railDrill(a){
 const g=cleatGeom(a),hs=heightsFromPlan(a);

// Parcours chantier : chaque nouvelle mesure part du dernier point réel.

function plannedHeight(H,a,p){

}
function drillingRoute(w){

  const pts=fixingPoints(a);
  // Pour 4 points, déplacement dans le sens des aiguilles d'une montre.
  const order=a.points===4?[pts[0],pts[1],pts[3],pts[2]]:pts;
  for(const point of order){
   const prev=result.length?result[result.length-1]:null;
   const y=plannedHeight(H,a,point);
   const dx=point.x-(prev?prev.x:0);
   const dy=prev&&y!==null&&prev.y!==null?y-prev.y:null;
   result.push({n:result.length+1,a,point,x:point.x,y,dx,dy,prev,sameWork:!!prev&&prev.a===a,sameRow:!!prev&&prev.a===a&&prev.point.position===point.position});

}
function horizontalInstruction(step){

 if(!step.prev)return `Depuis le bord gauche du mur : ${direction}`;

function applyDirectGap(index, wanted){
  const {aa,gaps}=layout();
  if(!aa.length||!Number.isInteger(index)||index<0||index>=gaps.length)return 'Aucun écart à modifier.';
  if(!Number.isFinite(wanted)||wanted<0)return 'Saisis une distance supérieure ou égale à zéro.';
  const delta = wanted-gaps[index].n, eps=0.00001;
  let moving=[], shift=0;
  if(index===aa.length){
    // Changing the right margin moves only the last artwork: other positions stay untouched.
    moving=[aa[aa.length-1]];shift=-delta;
  } else {
    // Changing an interior gap moves that artwork and every artwork after it, preserving their spacing.
    // Changing the left margin shifts the complete group.
    moving=aa.slice(index);shift=delta;
  }
  const movedIds=new Set(moving.map(a=>a.id));
  const positions=aa.map(a=>({id:a.id,x:a.x+(movedIds.has(a.id)?shift:0),w:a.w}));
  if(positions.some(a=>a.x<-eps||a.x+a.w>s.wallW+eps))return 'Distance impossible : une œuvre sortirait du mur.';
  for(let i=1;i<positions.length;i++){
    if(positions[i].x < positions[i-1].x+positions[i-1].w-eps)return 'Distance impossible : les œuvres se chevaucheraient.';
  }
  moving.forEach(a=>a.x=Math.round((a.x+shift)*1000)/1000);
  return null;
}

 if(m==='entraxe'){
  put(n(o.w),n(xs[0]-o.x),n(o.x+o.w-xs[xs.length-1]));
  rfCalc.note='Mesures de « '+o.name+' » reprises du plan.';return;
 }
 if(!next){put('','','');rfCalc.note='« '+o.name+' » est la dernière œuvre à droite : choisis-en une autre.';return}
 put(n(o.x+o.w-xs[xs.length-1]),n(next.x-(o.x+o.w)),n(holeXs(next)[0]-next.x));
 rfCalc.note='De « '+o.name+' » à « '+next.name+' », repris du plan.';
}

// Schéma : mêmes numéros ①②③ que les champs ; le résultat est en rouge.
function rfSketch(g,m){
 const B=(x,y,t,res)=>'<g class="sk-b'+(res?' res':'')+'"><circle cx="'+x+'" cy="'+y+'" r="8"/><text x="'+x+'" y="'+y+'">'+t+'</text></g>';
 const V=(x,y1,y2,t,res)=>'<g class="'+(res?'sk-res':'sk-dim')+'"><line x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+y2+'"/><line x1="'+(x-4)+'" y1="'+y1+'" x2="'+(x+4)+'" y2="'+y1+'"/><line x1="'+(x-4)+'" y1="'+y2+'" x2="'+(x+4)+'" y2="'+y2+'"/></g>'+B(x,(y1+y2)/2,t,res);
 const Hz=(y,x1,x2,t,res)=>'<g class="'+(res?'sk-res':'sk-dim')+'"><line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'"/><line x1="'+x1+'" y1="'+(y-4)+'" x2="'+x1+'" y2="'+(y+4)+'"/><line x1="'+x2+'" y1="'+(y-4)+'" x2="'+x2+'" y2="'+(y+4)+'"/></g>'+B((x1+x2)/2,y,t,res);
 const gd=(x1,y1,x2,y2)=>'<line class="sk-guide" x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'"/>';
 const hole=(x,y)=>'<circle class="sk-hole" cx="'+x+'" cy="'+y+'" r="3.5"/>';
 const rect=(c,x,y,w,h)=>'<rect class="'+c+'" x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="2"/>';
 const F=138,T=26,Bt=102,HY=48,C=64;          // sol, haut, bas, trou, milieu (schéma vertical)
 let body='';
 if(g==='h'){
  body+='<line class="sk-floor" x1="20" y1="'+F+'" x2="280" y2="'+F+'"/>';
  if(m==='decalage'){
   body+=gd(60,100,110,100)+gd(110,100,155,100)+gd(155,44,200,44)+gd(200,44,250,44)+hole(110,100)+hole(200,44)+V(60,F,100,'1')+V(250,F,44,'2')+V(155,100,44,'=',true);
  }else{
   body+=rect('sk-art',125,T,90,Bt-T);
   const refY=m==='milieu'?C:m==='haut'?T:Bt;
   body+=gd(88,refY,125,refY)+gd(48,HY,170,HY);
   if(m==='milieu')body+=gd(125,C,215,C);
   body+=hole(170,HY)+V(48,F,HY,'=',true)+V(88,F,refY,'1');
   if(m==='haut')body+=V(150,T,HY,'2');
   else if(m==='milieu')body+=V(245,T,Bt,'2')+gd(215,T,245,T)+gd(215,Bt,245,Bt)+V(150,T,HY,'3');
   else body+=V(245,T,Bt,'2')+gd(215,T,245,T)+gd(215,Bt,245,Bt)+V(150,T,HY,'3');
  }
 }else if(m==='trous'){
  body+=rect('sk-art',10,22,110,68)+rect('sk-art',170,22,120,68)+hole(98,44)+hole(192,44)
   +gd(120,90,120,108)+gd(170,90,170,108)+gd(98,44,98,134)+gd(192,44,192,134)
   +Hz(108,98,120,'1')+Hz(108,120,170,'2')+Hz(108,170,192,'3')+Hz(134,98,192,'=',true);
 }else if(m==='entraxe'){
  body+=rect('sk-art',30,22,240,68)+hole(62,44)+hole(238,44)
   +gd(62,44,62,108)+gd(238,44,238,108)+gd(30,90,30,134)+gd(270,90,270,134)
   +Hz(108,30,62,'2')+Hz(108,238,270,'3')+Hz(134,30,270,'1')+Hz(66,62,238,'=',true);
 }else{
  body+=rect('sk-wall',10,16,280,88)+rect('sk-art',40,44,50,50)+rect('sk-art',120,44,70,50)+rect('sk-art',220,44,40,50)
   +gd(10,104,10,128)+gd(290,104,290,128)
   +Hz(30,40,90,'2')+Hz(30,120,190,'2')+Hz(30,220,260,'2')
   +Hz(69,10,40,'=',true)+Hz(69,90,120,'=',true)+Hz(69,190,220,'=',true)+Hz(69,260,290,'=',true)
   +Hz(128,10,290,'1');
 }
 return '<svg class="calc-sketch" viewBox="0 0 300 150" role="img" aria-label="Schéma des mesures à saisir">'+body+'</svg>';
}

function rfCalcRestore(c){

const sanitizeName=(v,fallback)=>{const t=String(v??'').replace(/[\u0000-\u001f\u007f]+/g,' ').replace(/\s+/g,' ').trim().slice(0,60);return t||fallback};

// — Sauvegarde / restauration du projet (fichier .json) —
const DATA_URL_RE=/^data:[a-z0-9.+\/-]{0,60};base64,[A-Za-z0-9+\/=]+$/i;
const cleanNum=(v,min,max,fallback)=>{const n=Number(v);return v!==null&&v!==''&&Number.isFinite(n)&&n>=min&&n<=max?n:fallback};
// Réglages du rail (tasseaux emboîtés) : communs à toutes les œuvres du projet.
function cleanCleat(c){
 if(!c||typeof c!=='object')return {h:5,end:5,gap:40,d:''};
 return {h:cleanNum(c.h,0.5,50,5),end:cleanNum(c.end,0,100,5),gap:cleanNum(c.gap,5,300,40),d:(c.d===''||c.d===null||c.d===undefined)?'':cleanNum(c.d,-50,100,'')};
}
function cleanDataUrl(v,maxLen){return typeof v==='string'&&v.length<=maxLen&&DATA_URL_RE.test(v)?v:null}
function cleanArt(a,usedIds){
 if(!a||typeof a!=='object')throw new Error('une œuvre est illisible');
 let id=Number.isInteger(a.id)&&a.id>0&&!usedIds.has(a.id)?a.id:null;
 if(id===null){id=1;while(usedIds.has(id))id++}
 usedIds.add(id);
 const w=cleanNum(a.w,1,100000,null),h=cleanNum(a.h,1,100000,null);
 if(w===null||h===null)throw new Error('dimensions d’œuvre invalides');
 const out={id,name:sanitizeName(a.name,'Œuvre '+id),w,h,x:cleanNum(a.x,-100000,100000,0),y:cleanNum(a.y,-100000,100000,0),edge:cleanNum(a.edge,0,100000,10),top:cleanNum(a.top,-200,100000,8),points:[1,2,3,4,'rail'].includes(a.points)?a.points:2};
 if('bottomOffset' in a)out.bottomOffset=cleanNum(a.bottomOffset,0,100000,'');
 if(a.installed===true)out.installed=true;
 const photo=cleanDataUrl(a.photo,8e6);if(photo)out.photo=photo;
 return out;
}
function cleanWall(w,usedIds){
 if(!w||typeof w!=='object'||!Array.isArray(w.arts))throw new Error('un mur est illisible');
 let id=typeof w.id==='string'&&/^[A-Z]$/.test(w.id)&&!usedIds.has(w.id)?w.id:null;
 if(!id){for(let i=0;i<26;i++){const c=String.fromCharCode(65+i);if(!usedIds.has(c)){id=c;break}}}
 if(!id)throw new Error('plus de 26 murs');
 usedIds.add(id);
 const wallW=cleanNum(w.wallW,50,100000,null),wallH=cleanNum(w.wallH,50,100000,null);
 if(wallW===null||wallH===null)throw new Error('dimensions de mur invalides');
 if(w.arts.length>500)throw new Error('trop d’œuvres sur un mur');
 const used=new Set(),arts=w.arts.map(a=>cleanArt(a,used));
 let plan=null;const ip=w.importedPlan;
 if(ip&&typeof ip==='object'&&(ip.kind==='pdf'||ip.kind==='image')){const data=cleanDataUrl(ip.data,2e7);if(data)plan={name:sanitizeName(ip.name,'Plan'),kind:ip.kind,data}}
 return {id,name:sanitizeName(w.name,'Mur '+id),wallW,wallH,desiredGap:cleanNum(w.desiredGap,0,100000,10),showFixings:w.showFixings!==false,heightOpen:w.heightOpen===true,centerOpen:false,centerHeight:cleanNum(w.centerHeight,0,100000,150),centerScope:w.centerScope==='one'?'one':'all',bottomOpen:false,bottomHeight:cleanNum(w.bottomHeight,0,100000,110),bottomScope:w.bottomScope==='all'?'all':'one',selected:arts.some(a=>a.id===w.selected)?w.selected:(arts[0]?.id??null),arts,importedPlan:plan};
}
function parseProject(text){
 let data;try{data=JSON.parse(text)}catch(_){throw new Error('ce fichier n’est pas un JSON valide')}
 if(!data||typeof data!=='object'||data.app!=='ridfou-expo')throw new Error('ce fichier n’est pas une sauvegarde Ridfou Expo');
 if(data.version!==1)throw new Error('version de sauvegarde non reconnue');
 if(!Array.isArray(data.walls)||!data.walls.length)throw new Error('aucun mur dans la sauvegarde');
 if(data.walls.length>26)throw new Error('plus de 26 murs dans la sauvegarde');
 const used=new Set(),walls=data.walls.map(w=>cleanWall(w,used));
 return {walls,cleat:cleanCleat(data.cleat),current:walls.some(w=>w.id===data.currentWallId)?data.currentWallId:walls[0].id};
}

 syncActiveWall();

  walls:s.walls.map(w=>({...w,importedPlan:w.importedPlan?{name:w.importedPlan.name,kind:w.importedPlan.kind,data:w.importedPlan.data}:null}))};
}
async function exportProject(){
 const filename=`Ridfou-Expo-projet-${new Date().toISOString().slice(0,10)}.json`;
 const blob=new Blob([JSON.stringify(projectSnapshot())],{type:'application/json'});
 const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const file=new File([blob],filename,{type:'application/json'});
 if(isiOS&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file],title:'Ridfou Expo - sauvegarde'});projectMsg='Sauvegarde partagée : '+filename}
  catch(e){projectMsg=e?.name==='AbortError'?'':'Le partage a échoué. Réessaie, ou ouvre Ridfou Expo dans Safari.'}
 }else{
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  projectMsg='Sauvegarde téléchargée : '+filename;
 }
 draw();
}
function importProjectFile(file){
 if(!file)return;
 if(file.size>80*1024*1024){alert('Fichier trop volumineux (maximum 80 Mo).');return}
 const reader=new FileReader();
 reader.onerror=()=>alert('Impossible de lire ce fichier.');
 reader.onload=()=>{
  let parsed;
  try{parsed=parseProject(String(reader.result))}
  catch(err){alert('Import impossible : '+(err.message||err)+'. Le projet actuel n’a pas été modifié.');return}
  const nArts=parsed.walls.reduce((n,w)=>n+w.arts.length,0);
  if(!confirm(`Remplacer le projet actuel (${s.walls.length} mur(s)) par « ${file.name} » (${parsed.walls.length} mur(s), ${nArts} œuvre(s)) ?\nLes données actuelles de cet appareil seront écrasées.`))return;
  s.walls=parsed.walls;s.cleat=parsed.cleat;pendingDeleteWallId=null;s.deleteId=null;
  loadWall(s.walls.find(w=>w.id===parsed.current)||s.walls[0]);
  s.tab='plan';projectMsg=`Projet importé : ${s.walls.length} mur(s), ${nArts} œuvre(s).`;draw();pwaWrite();
 };
 reader.readAsText(file);
}

}

function handleExtraChange(e){
 const t=e.target;if(!t||!t.matches)return false;
 if(t.matches('input[data-calc-above]')){rfCalc.hAbove=t.checked;draw();return true}
 if(t.matches('input[data-cleat]')){
  const k=t.dataset.cleat,lim={h:[0.5,50],end:[0,100],gap:[5,300],d:[-50,100]}[k];
  if(!lim)return true;
  const raw=t.value.trim().replace(',','.');
  if(raw===''&&k==='d'){s.cleat.d='';draw();return true}
  const n=Number(raw);
  if(!raw||!Number.isFinite(n)||n<lim[0]||n>lim[1]){alert('Valeur hors limites : entre '+lim[0]+' et '+lim[1]+' cm.');draw();return true}
  s.cleat[k]=n;draw();return true;
 }
 if(t.matches('input[data-name-art]')){const a=s.arts.find(z=>z.id===Number(t.dataset.nameArt));if(a)a.name=sanitizeName(t.value,'Œuvre '+a.id);draw();return true}
 if(t.matches('input[data-name-wall]')){const w=s.walls.find(z=>z.id===t.dataset.nameWall);if(w)w.name=sanitizeName(t.value,'Mur '+w.id);draw();return true}
 if(t.matches('input[data-pos]')){
  const a=art();if(!a)return true;
  const raw=t.value.trim().replace(',','.'),n=Number(raw);
  if(!raw||!Number.isFinite(n)||n<0){alert('Indique une distance positive ou nulle.');draw();return true}
  if(t.dataset.pos==='x'){
   if(n+a.w>s.wallW+0.00001){alert(`Position impossible : ${a.name} (${f(a.w)} cm) sortirait du mur (${f(s.wallW)} cm de large). Maximum : ${f(Math.max(0,s.wallW-a.w))} cm.`);draw();return true}
   a.x=n;
  }else{
   if(n+a.h>s.wallH+0.00001){alert(`Hauteur impossible : ${a.name} (${f(a.h)} cm) dépasserait le haut du mur (${f(s.wallH)} cm). Maximum : ${f(Math.max(0,s.wallH-a.h))} cm.`);draw();return true}
   a.y=s.wallH-n-a.h;
  }
  draw();return true;
 }
 if(t.matches('input[type="file"][data-import-project]')){const file=t.files&&t.files[0];t.value='';importProjectFile(file);return true}
 return false;
}

const measureImg=()=>out.querySelector('#measure-img');
function measureDist(a,b){const img=measureImg();if(!img||!img.naturalWidth)return 0;return Math.hypot((a.x-b.x)*img.naturalWidth,(a.y-b.y)*img.naturalHeight)}
function measureLen(){return measure.pts.length===2&&measure.cmPerUnit?measureDist(measure.pts[0],measure.pts[1])*measure.cmPerUnit:null}

}
function measureControls(){
 const note='<p class="hint">Mesure indicative : la photo doit être prise bien de face, sans perspective. Vérifie sur place avant de percer.</p>';
 const err=measure.msg?`<div class="recognition-error" role="alert">${safeText(measure.msg)}</div>`:'';
 const ok=measure.ok?`<div class="project-msg" role="status">${safeText(measure.ok)}</div>`:'';
 const close='<button type="button" class="btn" data-act="measureClose">Fermer la mesure</button>';
 if(measure.mode==='cal'){
  if(measure.cal.length<2)return `<p class="hint"><strong>1. Échelle</strong> — touche deux points du plan dont tu connais la distance réelle (une cote écrite sur le plan, par exemple). Plus ils sont éloignés, plus la mesure est précise.${measure.cal.length===1?' Touche maintenant le deuxième point.':''}</p>${err}<div class="actions">${close}</div>${note}`;
  return `<p class="hint"><strong>1. Échelle</strong> — quelle est la distance réelle entre ces deux points ?</p><div class="row" style="align-items:flex-end"><div class="field"><label for="measure-real">Distance réelle (cm)</label><input id="measure-real" type="number" inputmode="decimal" step="0.1" min="1" placeholder="Ex. 250"></div><button type="button" class="btn primary" data-act="measureCalibrate">Valider l’échelle</button></div>${err}<div class="actions"><button type="button" class="btn" data-act="measureRedoCal">Refaire les points</button>${close}</div>${note}`;
 }
 const len=measureLen();
 const head=`<p class="hint"><strong>2. Mesure</strong> — touche les deux extrémités de la longueur à relever.${measure.pts.length===1?' Touche maintenant le deuxième point.':''}</p>`;
 if(len===null)return `${head}${ok}${err}<div class="actions"><button type="button" class="btn" data-act="measureRecalibrate">Recalibrer</button>${close}</div>${note}`;
 return `${head}<div class="measure-result">≈ ${f(len)} cm</div>${err}<div class="actions"><button type="button" class="btn primary" data-act="measureApplyWidth">Utiliser comme largeur de ce mur</button><button type="button" class="btn" data-act="measureNewWall">Créer un mur de ${f(len)} cm</button></div><div class="actions"><button type="button" class="btn" data-act="measureAgain">Nouvelle mesure</button><button type="button" class="btn" data-act="measureRecalibrate">Recalibrer</button>${close}</div>${note}`;
}
function measureUpdate(){
 const stage=out.querySelector('#measure-stage');if(!stage)return;
 const dots=[],lines=[];
 const add=(pts,kind)=>{pts.forEach(p=>dots.push(`<span class="measure-dot ${kind}" style="left:${p.x*100}%;top:${p.y*100}%"></span>`));if(pts.length===2)lines.push(`<line class="${kind}" x1="${pts[0].x*100}" y1="${pts[0].y*100}" x2="${pts[1].x*100}" y2="${pts[1].y*100}"/>`)};
 add(measure.cal,'cal');add(measure.pts,'meas');
 stage.querySelector('.measure-lines').innerHTML=lines.join('');
 stage.querySelector('.measure-dots').innerHTML=dots.join('');
 const c=out.querySelector('#measure-controls');if(c)c.innerHTML=measureControls();
}
function measureTap(e,stage){
 const r=stage.querySelector('img').getBoundingClientRect();if(!r.width||!r.height)return;
 const p={x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))};
 if(measure.mode==='cal'){if(measure.cal.length>=2)measure.cal=[];measure.cal.push(p)}
 else{if(measure.pts.length>=2)measure.pts=[];measure.pts.push(p)}
 measure.msg='';measure.ok='';measureUpdate();
}
function bindMeasure(){const st=out.querySelector('#measure-stage');if(!st)return;st.addEventListener('click',ev=>measureTap(ev,st));measureUpdate()}
function measureAction(act){
 if(act==='startMeasure'){measureReset();measure.active=true;importPreviewOpen=true;draw();return}
 if(act==='measureClose'){measureReset();draw();return}
 if(act==='measureRedoCal'){measure.cal=[];measure.msg='';measureUpdate();return}
 if(act==='measureRecalibrate'){measure.mode='cal';measure.cal=[];measure.pts=[];measure.msg='';measure.ok='';measureUpdate();return}
 if(act==='measureAgain'){measure.pts=[];measure.msg='';measure.ok='';measureUpdate();return}
 if(act==='measureCalibrate'){
  const real=Number(String(out.querySelector('#measure-real')?.value||'').trim().replace(',','.'));
  if(!Number.isFinite(real)||real<=0||real>100000){measure.msg='Entre la distance réelle en centimètres.';measureUpdate();return}
  if(measure.cal.length<2)return;
  const px=measureDist(measure.cal[0],measure.cal[1]);
  if(px<8){measure.msg='Les deux points sont trop proches : choisis-en deux plus éloignés.';measureUpdate();return}
  measure.cmPerUnit=real/px;measure.mode='measure';measure.pts=[];measure.msg='';measure.ok='';measureUpdate();return;
 }
 if(act==='measureApplyWidth'||act==='measureNewWall'){
  const len=measureLen();if(len===null)return;
  const cm=Math.round(len*10)/10;
  if(cm<50||cm>2500){measure.msg='Longueur hors limites (50 à 2 500 cm) : vérifie les points et l’échelle.';measureUpdate();return}
  if(act==='measureApplyWidth'){s.wallW=cm;measure.ok=`Largeur du mur : ${f(cm)} cm.`}
  else{const w=addWall(cm,true);if(!w)return;measure.ok=`${w.name} créé : ${f(cm)} cm de large. Tu peux continuer à mesurer.`}
  measure.pts=[];measure.msg='';draw();
 }
}

if(['plan','works','attach','drill'].includes(act)){s.tab=act;s.siteMode=false;draw();return}if(act==='toggleCenter'){s.centerOpen=!s.centerOpen;draw();return}if(act==='toggleBottom'){s.bottomOpen=!s.bottomOpen;draw();return}if(act==='applyBottom'){const input=out.querySelector('[data-bottom-height]');const raw=input?.value?.trim()||'';const n=Number(raw);const scope=out.querySelector('input[name="bottomScope"]:checked')?.value||s.bottomScope;if(!raw||!Number.isFinite(n)||n<0||n>s.wallH){alert('Indique une hauteur comprise entre 0 et '+f(s.wallH)+' cm.');return}const aa=scope==='all'?s.arts:[art()].filter(Boolean);if(!aa.length){alert('Aucune œuvre sélectionnée.');return}const impossible=aa.filter(a=>n+a.h>s.wallH+0.00001);if(impossible.length){alert('Hauteur impossible pour '+impossible.map(a=>a.name).join(', ')+' : les œuvres doivent rester dans le mur.');return}s.bottomHeight=n;s.bottomScope=scope;for(const a of aa)a.y=s.wallH-n-a.h;draw();return}if(act==='applyCenter'){const input=out.querySelector('[data-center-height]');const raw=input?.value?.trim()||'';const n=Number(raw);const scope=out.querySelector('input[name="centerScope"]:checked')?.value||s.centerScope;if(!raw||!Number.isFinite(n)||n<0||n>s.wallH){alert('Indique une hauteur comprise entre 0 et '+f(s.wallH)+' cm.');return}const aa=scope==='all'?s.arts:[art()].filter(Boolean);if(!aa.length){alert('Aucune œuvre sélectionnée.');return}const impossible=aa.filter(a=>n<a.h/2-0.00001||n>s.wallH-a.h/2+0.00001);if(impossible.length){alert('Hauteur impossible pour '+impossible.map(a=>a.name).join(', ')+' : les œuvres doivent rester dans le mur.');return}s.centerHeight=n;s.centerScope=scope;for(const a of aa)a.y=s.wallH-n-a.h/2;draw();return}if(act==='toggleGap'){s.gapOpen=!s.gapOpen;draw();return}if(act==='toggleHeight'){s.heightOpen=!s.heightOpen;draw();return}if(act==='select'){s.selected=Number(b.dataset.id);s.deleteId=null;draw();return}if(act==='askDelete'){s.deleteId=Number(b.dataset.id);draw();return}if(act==='cancelDelete'){s.deleteId=null;draw();return}if(act==='confirmDelete'){const id=Number(b.dataset.id);if(id!==s.deleteId)return;s.arts=s.arts.filter(a=>a.id!==id);if(s.selected===id)s.selected=s.arts[0]?.id??null;s.deleteId=null;draw();return}if(act==='add'){const id=Math.max(0,...s.arts.map(a=>a.id))+1;s.arts.push({id,name:'Œuvre '+id,w:50,h:75,x:Math.max(0,Math.min(40*id,s.wallW-50)),y:90,edge:10,top:8,points:2});s.selected=id;s.tab='works';s.deleteId=null;draw();return}if(act==='equal'){if(!s.arts.length){alert('Ajoute d’abord une œuvre sur ce mur depuis l’onglet Œuvres.');return}const aa=[...s.arts].sort((a,b)=>a.x-b.x),total=aa.reduce((v,a)=>v+a.w,0);if(total>=s.wallW){alert('Le total des largeurs dépasse le mur.');return}const gap=(s.wallW-total)/(aa.length+1);let x=gap;for(const a of aa){a.x=x;x+=a.w+gap}draw();return}if(act==='applyGap'){const input=out.querySelector('[data-key="desiredGap"]'),n=Number(input?.value);if(!input||input.value.trim()===''||!Number.isFinite(n)||n<0){alert('Indique un écart positif ou nul.');return}s.desiredGap=n;applyGap(n);draw();return}if(act==='presetGap'){const n=Number(b.dataset.id);s.desiredGap=n;applyGap(n);draw();return}if(['center','top','bottom'].includes(act)){const a=art();if(!a)return;const ref=act==='center'?a.y+a.h/2:act==='top'?a.y:a.y+a.h;for(const v of s.arts){v.y=Math.max(0,Math.min(s.wallH-v.h,act==='center'?ref-v.h/2:act==='top'?ref:ref-v.h))}draw();return}if(act==='removePhoto'){const a=s.arts.find(z=>z.id===Number(b.dataset.id));if(a){delete a.photo;draw()}return}if(act==='points'){const a=art();if(a){const raw=b.dataset.id;a.points=raw==='rail'?'rail':Number(raw);if(a.points==='rail'&&Number(a.top)<0)a.top=Math.abs(a.top);if(a.points===4&&a.bottomOffset===undefined)a.bottomOffset=''}draw()}});
