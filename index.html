te(-50%,-50%) rotate(-90deg);transform-origin:center;white-space:nowrap;background:#f8f8f4;border-radius:4px;color:#135c4f;font-size:11px;font-weight:750;padding:3px 5px}.axg .work-size{position:absolute;z-index:2;pointer-events:none;transform:translateX(-50%);background:#f7f7f1ee;border:1px solid #bdd4ca;border-radius:4px;color:#125f52;padding:1px 3px;white-space:nowrap;font-size:10px;font-weight:750}.axg .mid-guide{position:absolute;left:0;right:0;z-index:5;border-top:2px dashed #548b83;pointer-events:none}.axg .mid-guide span{position:absolute;top:-18px;left:4px;background:#f7f7f1e8;border-radius:3px;padding:1px 3px;color:#14695d;font-weight:750;font-size:10px}
/* Only new visual style: Japanese red screw height + neutral gray center height */
.axg .height-guide{position:absolute;left:0;right:0;z-index:2;pointer-events:none;border-top:1px dotted #c63d43}.axg .height-guide.center-guide{border-top:1px dashed #999fa1}.axg .height-guide .dot{position:absolute;left:var(--dotpos,50%);top:-4px;width:7px;height:7px;border:1.5px solid #fff;border-radius:100%;background:#c63d43}
.axg .wall-stage{display:flex;width:100%;align-items:stretch}.axg .wall-stage .wall{flex:1;min-width:0}.axg .height-margin{width:94px;flex:0 0 94px;height:205px;background:#f8f7f3;position:relative;border:1px solid #a7aea9;border-right:0;overflow:hidden}.axg .height-margin .h-note{position:absolute;left:5px;right:3px;transform:translateY(-50%);font-size:10px;line-height:1.18;font-weight:700;pointer-events:none}.axg .height-margin .h-note strong{display:block;font-size:10px}.axg .height-margin .h-note.red{color:#bd373b}.axg .height-margin .h-note.gray{color:#61696e}.axg .height-margin .h-note:after{content:'';position:absolute;left:0;right:-4px;bottom:-4px;border-top:1px dotted currentColor;opacity:.45}
/* Correction ciblée : jauge de hauteur verticale, depuis le sol, comme ArtHang. */
.axg .height-margin .h-note:after{display:none}
.axg .height-margin .h-note.red{transform:translateY(-116%)}
.axg .height-margin .h-note.gray{transform:translateY(16%)}
.axg .height-margin .h-ruler{position:absolute;right:10px;bottom:0;border-left:2px solid #c63d43;pointer-events:none}
.axg .height-margin .h-ruler:before,.axg .height-margin .h-ruler:after{content:'';position:absolute;left:-6px;width:10px;border-top:1.5px solid #c63d43}
.axg .height-margin .h-ruler:before{top:0}.axg .height-margin .h-ruler:after{bottom:0}
.axg .height-margin .h-center-tick{position:absolute;right:5px;width:12px;border-top:1px solid #8b9394;pointer-events:none}

@media(max-width:380px){.axg .height-margin{width:78px;flex-basis:78px;height:170px}.axg .height-margin .h-note{font-size:9px}.axg .height-margin .h-note strong{font-size:9px}}
.axg .metrics{display:flex;gap:4px;align-items:stretch;margin-top:10px}.axg .metric{background:#fff!important;border:1px solid #81b2a4;border-radius:7px;min-width:0;flex:1;text-align:center;color:#145b4f!important;padding:0;font-size:11px;line-height:1.3;font-weight:650}.axg .metric button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:61px;width:100%;border:0;border-radius:7px;padding:7px 1px;background:transparent;color:inherit;font:inherit;cursor:pointer}.axg .metric button:focus-visible{outline:2px solid #2563eb;outline-offset:-2px}.axg .metric.editing{border:2px solid #2563eb;background:#e8f2ff!important}.axg .gap-direct-editor{margin-top:10px;padding:10px;border:1px solid #a8c8e3;background:#f8fbff;border-radius:10px}.axg .gap-direct-editor .row{align-items:flex-end}.axg .gap-direct-editor .field{max-width:145px}.axg .gap-direct-editor .btn{padding:9px 12px}.axg .gap-error{font-size:12px;color:#a13a38;font-weight:650;margin-top:7px}.axg .metric strong{display:block;font-size:15px;font-weight:850;color:#0d5146!important}.axg .metric.bad{background:#fff0ec!important;color:#a33431!important}.axg .metric.bad strong{color:#a33431!important}.axg .gapcontrol{margin:11px 0;padding:11px;border:1px solid var(--bd);border-radius:11px;background:var(--card)}.axg .gapcontrol .row{align-items:end}.axg .gapcontrol .field{max-width:155px}.axg .cards{display:grid;gap:9px;margin:12px 0}.axg .card{border:1px solid var(--bd);border-radius:11px;background:var(--panel);padding:12px}.axg .card.selected{border-color:#248478}.axg .cardtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.axg .pt{font-size:22px;font-weight:800;color:#198476}.axg .drill-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.axg .drill-point{border:1px solid var(--bd);border-radius:10px;padding:12px;background:#f8fbff}.axg .drill-point .small{margin-bottom:8px}.axg .drill-point.single{grid-column:1/-1}.axg .square{background:#faf9f6;border:1px solid #d3d4ce;border-radius:10px;padding:10px;margin-top:10px;color:#244b4b}.axg .foot{border-top:1px solid var(--bd);margin-top:14px;padding-top:11px;font-size:11px;color:var(--mut)}@media(max-width:380px){.axg .metric strong{font-size:12px}.axg .wall{height:170px}.axg .tabs button{font-size:11px}.axg .btn{padding:9px}.axg .drill-grid{gap:8px}}

/* Ciblé : le repère de hauteur est superposé dans le mur, pas une colonne à côté. */
.axg .height-margin{position:absolute;top:0;left:0;height:100%;width:10%;min-width:34px;flex:none;background:transparent;border:0;border-right:0;overflow:visible;pointer-events:none;z-index:5}
.axg .height-margin .h-ruler{right:2px}
.axg .height-margin .h-center-tick{right:-3px}
.axg .height-margin .h-note{left:4px;right:auto;width:32px;max-width:32px;font-size:10px;line-height:1.08;text-shadow:0 1px 0 #f8f7f3}
.axg .height-margin .h-note strong{font-size:10px;white-space:normal}
@media(max-width:380px){.axg .height-margin{height:100%;width:10%;min-width:34px}.axg .height-margin .h-note,.axg .height-margin .h-note strong{font-size:9px}}

/* Seulement les deux cotes générales : au-dessus et à droite du contour du mur. */
.axg .wall-stage{position:relative;margin-top:29px;width:calc(100% - 25px)}
.axg .wall-stage>.overall-h{left:0;right:0;top:-21px;z-index:6}
.axg .wall-stage>.overall-v{right:-22px;top:0;height:100%;z-index:6}

/* Addition limitée à l'onglet Œuvres : photo et affichage sur le mur. */
.axg .work.has-photo:before{display:none}
.axg .work .art-image{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#f4f0e7;pointer-events:none}
.axg .photo-preview{width:100%;max-width:170px;max-height:150px;object-fit:contain;background:#f4f0e7;border:1px solid var(--bd);border-radius:7px;display:block;margin:9px 0}
.axg .photo-picker{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.axg .photo-picker label{display:inline-flex;align-items:center;cursor:pointer}
.axg .photo-picker input[type=file]{position:absolute;width:1px;height:1px;padding:0;opacity:0;overflow:hidden}
.axg .work-edit-top{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:14px;align-items:start;margin-top:6px}
.axg .work-dims-row{align-items:flex-start}
.axg .work-dims-row .field{flex:0 1 145px;max-width:145px;min-width:110px}
.axg .photo-side{border:1px solid var(--bd);border-radius:10px;padding:10px;background:#f8fbff}
.axg .photo-side strong{display:block;margin-bottom:4px}
.axg .photo-side .hint{margin:0 0 6px}
.axg .photo-side .photo-picker{margin-top:8px}
@media(max-width:520px){.axg .work-edit-top{grid-template-columns:1fr}.axg .work-dims-row .field{max-width:none;flex:1 1 120px}.axg .plan-row.align{grid-template-columns:repeat(3,minmax(0,1fr))}.axg .plan-row.heights{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Sélecteur multi-murs : commandes compactes en haut du plan. */
.axg .wall-switch{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:end;gap:8px;margin:4px 0 13px}
.axg .wall-switch label{font-size:12px;font-weight:700;color:#415a75;display:block}
.axg .wall-switch select{width:100%;margin-top:5px;border:1px solid #b8cadc;border-radius:9px;min-height:41px;padding:9px;color:#20314a;background:#fff;font:inherit}
.axg .wall-switch .btn{min-height:41px;white-space:nowrap}
@media(max-width:380px){.axg .wall-switch{gap:6px}.axg .wall-switch .btn{padding-inline:9px}}

/* Import de plan de référence (image/photo/PDF) : aucun calcul automatique. */
.axg .wall-tools{display:flex;align-items:end;gap:6px}
.axg .wall-tools .btn{padding:10px 9px}
.axg .import-choices{display:flex;gap:7px;flex-wrap:wrap;margin:-4px 0 11px}
.axg .import-choices label{display:inline-flex;align-items:center;cursor:pointer}
.axg .import-choices input[type=file]{position:absolute;width:1px;height:1px;padding:0;opacity:0;overflow:hidden}
.axg .import-reference{margin:-2px 0 12px;padding:9px;border:1px solid #bbcedd;border-radius:10px;background:#fff}
.axg .import-reference .import-head{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.axg .import-reference .import-head .import-name{font-size:12px;flex:1;min-width:90px;overflow-wrap:anywhere;color:#324f70}
.axg .import-reference .btn{padding:6px 9px;font-size:11px}
.axg .import-reference img{display:block;width:auto;max-width:100%;max-height:330px;object-fit:contain;margin:9px auto 2px;border:1px solid var(--bd);border-radius:7px}
.axg .import-reference .import-info{font-size:11px;color:var(--mut);margin:7px 2px 0}
@media(max-width:390px){.axg .wall-tools .btn{padding:9px 6px;font-size:11px}.axg .wall-switch{gap:5px}}
/* Palette claire : reprise de Ridfou Expo existant, sans toucher à ses fonctionnalités. */
:root{color-scheme:light!important}
body{background:#f8f2e8!important;color:#183150!important}
.axg{color:#20314a!important;--ac:#2563eb;--bd:#c8d8e7;--mut:#60738a;--panel:#ffffff;--card:#eaf1f8}
.axg .brand{color:#183f68}
.axg .tag{color:#63758b}
.axg .tabs{background:#e7eff8;border-color:#c9d8e7}
.axg .tabs button{color:#536b84}
.axg .tabs button.sel{background:#ffffff!important;color:#1b568e!important;box-shadow:0 1px 4px #245d9a22}
.axg input,.axg select,.axg textarea{background:#ffffff!important;color:#20314a!important;border-color:#b8cadc!important}
.axg input::placeholder{color:#8a9bae}
.axg .field label{color:#435d77}
.axg .btn{background:#ffffff!important;color:#244461!important;border-color:#b7cbdd!important}
.axg .btn.primary{background:#2563eb!important;color:white!important;border-color:#2563eb!important}
.axg .btn.active{background:#e2f2ec!important;color:#155f55!important;border-color:#98cabc!important}
.axg .btn.danger{background:#fff7f6!important;color:#a53f3b!important;border-color:#d8a29b!important}
.axg .card,.axg .gapcontrol{background:#ffffff!important;border-color:#d0deeb!important}
.axg .card.selected{border-color:#367dc1!important;box-shadow:inset 0 0 0 1px #b6d4ef}
.axg .pt{color:#1a609c!important}
.axg .pill{background:#e4f0fb;color:#235d91}
.axg .wallbox{background:#f4f4f1!important}
.axg .hint,.axg .small,.axg .foot{color:#647891!important}
.axg .foot{border-top-color:#cbd8e6}
.axg button:focus-visible,.axg input:focus-visible{outline:2px solid #4393dd;outline-offset:2px}

/* Import intelligent : propositions vérifiables, sans écraser les murs existants. */
.axg .recognition{margin-top:10px;border:1px solid #b8cadc;border-radius:12px;background:#fff;padding:12px}
.axg .recognition-head{display:flex;justify-content:space-between;gap:8px;align-items:start;flex-wrap:wrap}
.axg .recognition-head strong{color:#1c4771}
.axg .recognition-status{font-size:12px;color:#5a718a;margin:6px 0}
.axg .wall-count-found{display:grid;gap:4px;border:1px solid #a3cbb9;background:#eef8f2;border-radius:10px;padding:10px;color:#225e49;margin:10px 0}
.axg .wall-count-found strong{font-size:15px}.axg .wall-count-found span{font-size:12px}.axg .wall-count-found small{font-size:11px;line-height:1.4;color:#496b5a}
.axg .recognition-list{display:grid;gap:8px;margin-top:9px}
.axg .recognition-item{display:grid;grid-template-columns:28px minmax(0,1fr) 100px;align-items:center;gap:8px;border:1px solid #d1dfec;border-radius:9px;padding:9px;background:#f8fbff}
.axg .recognition-item .recognition-check{width:18px;height:18px;accent-color:#2563eb;cursor:pointer}
.axg .recognition-item .recognition-label{display:block;font-size:13px;font-weight:750;color:#2b4b69}
.axg .recognition-item .recognition-proof{display:block;font-size:11px;color:#667c90;line-height:1.35;margin-top:3px}
.axg .recognition-item .recognition-unit{font-size:11px;color:#4f6a84;display:block;margin-bottom:2px}
.axg .recognition-item input[type=number]{font-size:14px;padding:7px;max-width:100%;background:#fff!important}
.axg .recognition-warning{font-size:12px;line-height:1.45;color:#94602b;margin-top:8px}
.axg .recognition-error{font-size:12px;font-weight:650;color:#a53f3b;margin-top:7px}
.axg .recognition-btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
@media(max-width:380px){.axg .recognition-item{grid-template-columns:20px minmax(0,1fr) 82px;gap:5px;padding:6px}}

/* Attaches : ordre 1, 2, 3, 4, Rail, visibles sur une seule ligne. */
.axg .attach-points{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:12px 0;align-items:stretch}
.axg .attach-points .btn{min-width:0;white-space:nowrap;padding:10px 2px;font-size:11px;text-align:center}
@media(max-width:380px){.axg .attach-points{gap:3px}.axg .attach-points .btn{font-size:10px;padding:9px 1px}}

/* Ridfou Expo : points sur plan, mode chantier, export papier/PDF - ajouts ciblés */
.axg .art-fix{position:absolute;z-index:8;display:flex;align-items:center;justify-content:center;width:12px;height:12px;transform:translate(-50%,-50%);border-radius:50%;border:1.5px solid #fff;background:#ce3c48;color:#fff;font-size:12px;font-weight:850;line-height:1;box-shadow:0 0 0 1px #b22e3c;pointer-events:none}
.axg .art-fix.unconfirmed{background:#f9f5e5;border:2px dashed #b8752f;box-shadow:none;color:#99571a}
.axg .drill-help{font-size:11px;color:var(--mut);line-height:1.5;margin:5px 0}
.axg .drill-points{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:10px 0}
.axg .drill-points .drill-point{min-width:0}
.axg .drill-points .drill-point .small{margin-bottom:5px}
.axg .drill-points .drill-point strong{display:block;font-size:21px;font-weight:850;color:#165e9b}
.axg .drill-points .drill-point em{display:block;font-size:11px;color:#657991;font-style:normal}
.axg .notice-attach{margin-top:9px;padding:9px;background:#fff8e9;border:1px solid #e6c995;border-radius:9px;color:#81551e;font-size:12px;line-height:1.4}
.axg .site-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.axg .site-progress{height:9px;background:#dfebf2;border-radius:99px;overflow:hidden;margin:10px 0}
.axg .site-progress div{height:100%;background:#227c6f;transition:width .2s}
.axg .site-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #e0e8f0;padding:11px 0}
.axg .site-row:last-child{border-bottom:0}
.axg .site-row .site-name{font-weight:700;color:#274561}
.axg .site-row .site-measures{font-size:11px;color:#647891;margin-top:4px;line-height:1.4}
.axg .site-row .btn.done{color:#126e52!important;border-color:#91c6af!important;background:#e8f7ef!important}
.axg .site-row .btn{flex:none}

</style></head><body>
<div id="acc-expo-height" class="axg">
<div class="bar"><div class="brand">▣ Ridfou Expo</div><span class="tag">Ridfou Expo</span></div>
<div class="tabs"><button data-tab="plan" class="sel">▣ Mur</button><button data-tab="works">▧ Œuvres</button><button data-tab="attach">⌁ Attaches</button><button data-tab="drill">⊕ Perçage</button><button data-tab="calc">∑ Calculs</button></div>
<div id="axg-screen"></div>
<div class="foot">La hauteur au sol est facultative. Les distances et calculs horizontaux fonctionnent sans elle. Prototype de démonstration.</div>
</div>
<script>
(function(){
const root=document.getElementById('acc-expo-height');if(!root||root.dataset.started)return;root.dataset.started='1';
const out=root.querySelector('#axg-screen');
// Sauvegarde locale de la V1 : dimensions, emplacements, attaches et photos.
// IndexedDB accepte de grandes photos compressées, contrairement à localStorage.
const PWA_DB='AccrocheExpoV1';
const PWA_STORE='project';
const PWA_KEY='current';
let pwaDb=null, pwaLoaded=false, pwaSaveTimer=null;
function pwaOpen(){
 return new Promise(resolve=>{
  if(!('indexedDB' in window)){resolve(null);return}
  try{
   const request=indexedDB.open(PWA_DB,1);
   request.onupgradeneeded=()=>{
    const db=request.result;
    if(!db.objectStoreNames.contains(PWA_STORE))db.createObjectStore(PWA_STORE);
   };
   request.onsuccess=()=>resolve(request.result);
   request.onerror=()=>resolve(null);
   request.onblocked=()=>resolve(null);
  }catch(_){resolve(null)}
 });
}
function pwaRead(db){
 return new Promise(resolve=>{
  if(!db){try{resolve(JSON.parse(localStorage.getItem(PWA_DB)||'null'))}catch(_){resolve(null)}return}
  try{
   const request=db.transaction(PWA_STORE,'readonly').objectStore(PWA_STORE).get(PWA_KEY);
   request.onsuccess=()=>resolve(request.result||null);
   request.onerror=()=>resolve(null);
  }catch(_){resolve(null)}
 });
}
function pwaSnapshot(){
 // Ignore la confirmation de suppression, qui n'est pas une donnée du projet.
 syncActiveWall();return {...s,deleteId:null};
}
function pwaWrite(){
 if(!pwaLoaded)return;
 if(pwaSaveTimer!==null){clearTimeout(pwaSaveTimer);pwaSaveTimer=null}
 const state=pwaSnapshot();
 if(pwaDb){
  try{pwaDb.transaction(PWA_STORE,'readwrite').objectStore(PWA_STORE).put(state,PWA_KEY)}
  catch(_){/* possibilité de stockage indisponible, garder la session courante */}
 }else{
  try{localStorage.setItem(PWA_DB,JSON.stringify(state))}catch(_){/* stockage local limité */}
 }
}
function pwaSave(){
 if(!pwaLoaded)return;
 if(pwaSaveTimer!==null)clearTimeout(pwaSaveTimer);
 pwaSaveTimer=setTimeout(pwaWrite,120);
}
function pwaStart(){
 pwaOpen().then(async db=>{
  pwaDb=db;
  const prev=await pwaRead(db);
  if(prev&&typeof prev==='object'&&Array.isArray(prev.arts)&&Number.isFinite(prev.wallW)&&Number.isFinite(prev.wallH)){
   const allowed=['showFixings','wallW','wallH','desiredGap','gapOpen','heightOpen','centerOpen','centerHeight','centerScope','bottomOpen','bottomHeight','bottomScope','selected','arts','importedPlan'];
   for(const key of allowed){if(Object.prototype.hasOwnProperty.call(prev,key))s[key]=prev[key]}
   if(!s.arts.some(a=>a.id===s.selected))s.selected=s.arts[0]?.id??null;
   if(Array.isArray(prev.walls)&&prev.walls.length){
    s.walls=prev.walls.filter(w=>w&&w.id&&Array.isArray(w.arts)&&Number.isFinite(w.wallW)&&Number.isFinite(w.wallH));
    const chosen=s.walls.find(w=>w.id===prev.currentWallId)||s.walls[0];
    if(chosen)loadWall(chosen);
   }
  }
  if(!s.walls.length){s.currentWallId='A';s.walls=[wallFromActive('A','Mur A')];}
  s.tab='plan';s.deleteId=null;
  pwaLoaded=true;
  draw();
 }).catch(()=>{pwaLoaded=true;draw()});
}
window.addEventListener('pagehide',pwaWrite);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')pwaWrite()});
if('serviceWorker' in navigator && location.protocol==='https:'){
 window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}

const s={walls:[],currentWallId:'A',tab:'plan',wallW:600,wallH:300,desiredGap:10,gapOpen:false,heightOpen:false,centerOpen:false,centerHeight:150,centerScope:'all',bottomOpen:false,bottomHeight:110,bottomScope:'one',showFixings:true,siteMode:false,selected:1,deleteId:null,importedPlan:null,arts:[
{id:1,name:'Œuvre 1',w:65,h:95,x:70,y:92,edge:12,top:8,points:2},
{id:2,name:'Œuvre 2',w:100,h:135,x:210,y:71,edge:15,top:10,points:2},
{id:3,name:'Œuvre 3',w:65,h:95,x:390,y:92,edge:12,top:8,points:2}
]};

// Compatibilité : les données existantes deviennent « Mur A » sans être effacées.
const WALL_KEYS=['showFixings','wallW','wallH','desiredGap','heightOpen','centerOpen','centerHeight','centerScope','bottomOpen','bottomHeight','bottomScope','selected','arts','importedPlan'];
function wallFromActive(id,name){
 const w={id,name};for(const k of WALL_KEYS)w[k]=s[k];return w;
}
function syncActiveWall(){
 if(!s.walls.length)return;
 const wall=s.walls.find(w=>w.id===s.currentWallId);
 if(!wall)return;
 for(const key of WALL_KEYS)wall[key]=s[key];
}
function loadWall(w){
 if(!w)return;
 s.currentWallId=w.id;
 for(const key of WALL_KEYS){if(Object.prototype.hasOwnProperty.call(w,key))s[key]=w[key];}
 s.importedPlan=w.importedPlan||null;
 s.selected=s.arts.some(a=>a.id===s.selected)?s.selected:(s.arts[0]?.id??null);
 s.centerOpen=false;s.bottomOpen=false;s.gapOpen=false;s.siteMode=false;importChoicesOpen=false;importPreviewOpen=false;
 editGapIndex=-1;gapError='';
}
function chooseWall(id){
 syncActiveWall();const wall=s.walls.find(w=>w.id===id);
 if(wall){loadWall(wall);s.tab='plan';draw();}
}
function addWall(){
 syncActiveWall();let index=0,id;
 do{id=String.fromCharCode(65+index);index++;}while(s.walls.some(w=>w.id===id)&&index<26);
 if(s.walls.some(w=>w.id===id)){alert('Maximum de 26 murs pour cette version.');return;}
 const newWall={id,name:`Mur ${id}`,wallW:600,wallH:300,desiredGap:10,showFixings:true,heightOpen:false,centerOpen:false,centerHeight:150,centerScope:'all',bottomOpen:false,bottomHeight:110,bottomScope:'one',selected:null,arts:[],importedPlan:null};
 s.walls.push(newWall);loadWall(newWall);s.tab='plan';draw();
}
let importChoicesOpen=false,importPreviewOpen=false;
const safeText=t=>String(t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Détection locale : les propositions ne remplacent jamais un mur sans validation.
let recognitionBusy=false;
let recognitionError='';
function formatCandidateCm(n){return Number.isFinite(Number(n))&&n!==''?Number(n).toFixed(1).replace(/\.0$/,''):'';}
function renderRecognition(p){
 const r=p?.analysis;if(!r)return `<div class="recognition-status">Analyse possible : lecture des cotes du PDF et recherche de tracés sur la photo. À vérifier.</div>`;
 if(r.state==='loading')return `<div class="recognition-status" role="status">Analyse du plan en cours…</div>`;
 const arr=Array.isArray(r.candidates)?r.candidates:[];
 return `<section class="recognition" aria-label="Murs proposés par l'analyse">
 <div class="recognition-head"><strong>Longueurs proposées depuis le plan</strong><span class="pill">À vérifier</span></div>
 <p class="recognition-status">${safeText(r.message||'Vérifie les dimensions avant de créer des murs.')}</p>
 ${Number.isInteger(r.declaredWallCount)&&r.declaredWallCount>0?`<div class="wall-count-found"><strong>${r.declaredWallCount} murs indiqués dans le document</strong><span>Source : « ${safeText(r.declaredCountEvidence)} »</span><small>Nombre relevé dans le texte du PDF, et non déduit du nombre de traits. Les dimensions restent à vérifier.</small></div>`:`<p class="recognition-status">Le nombre exact de murs n'est pas indiqué clairement dans le texte reconnu. Les propositions de longueur ne suffisent pas à le garantir.</p>`}
 ${arr.length?`<div class="recognition-list">${arr.map((c,i)=>`<div class="recognition-item">
 <input type="checkbox" class="recognition-check" data-candidate-check="${i}" ${c.checked?'checked':''} aria-label="Créer ${safeText(c.label)}">
 <div><span class="recognition-label">${safeText(c.label)}</span><span class="recognition-proof">${safeText(c.evidence||'À mesurer sur le plan')}</span></div>
 <label class="recognition-unit">Longueur (cm)<input type="number" inputmode="decimal" step="0.1" min="1" max="10000" data-candidate-cm="${i}" value="${formatCandidateCm(c.cm)}" placeholder="À saisir" aria-label="Longueur de ${safeText(c.label)} en centimètres"></label>
 </div>`).join('')}</div>`:''}
 <div class="recognition-warning">Ces valeurs sont des propositions, pas des mesures de perçage. Vérifie le tracé, l’unité, les murs d’accrochage et les longueurs avant de les créer. Les œuvres actuelles ne seront pas déplacées.</div>
 ${recognitionError?`<div class="recognition-error" role="alert">${safeText(recognitionError)}</div>`:''}
 <div class="recognition-btns"><button type="button" class="btn" data-act="rerunRecognition">↻ Réanalyser</button>${arr.length?`<button type="button" class="btn primary" data-act="createRecognizedWalls" ${r.applied?'disabled':''}>${r.applied?'Murs déjà créés':'Créer les murs sélectionnés'}</button>`:''}</div>
 </section>`;
}
async function parsePdfPlan(file){
 if(typeof DecompressionStream==='undefined')return {state:'ready',candidates:[],message:'Ce navigateur ne permet pas de décompresser ce PDF localement. Tu peux saisir les murs manuellement.'};
 const bytes=new Uint8Array(await file.arrayBuffer());
 // Lecture minimale des flux de contenu Flate (PDF vectoriels). Pas de serveur ni d'OCR.
 let raw='';for(let i=0;i<bytes.length;i+=8192)raw+=String.fromCharCode(...bytes.subarray(i,i+8192));
 const content=[];const streamRe=/stream\r?\n/g;let match,count=0;
 while((match=streamRe.exec(raw))&&count<80){
  count++;
  const beg=streamRe.lastIndex,end=raw.indexOf('endstream',beg);
  if(end<0)break;
  const header=raw.slice(Math.max(0,match.index-350),match.index);
  streamRe.lastIndex=end+9;
  if(!/\/FlateDecode/.test(header))continue;
  let stop=end;if(raw.charCodeAt(stop-1)===10)stop--;if(raw.charCodeAt(stop-1)===13)stop--;
  try{
   const ds=new Blob([bytes.slice(beg,stop)]).stream().pipeThrough(new DecompressionStream('deflate'));
   const out=new Uint8Array(await new Response(ds).arrayBuffer());
   if(out.length>5_000_000)continue;
   let txt='';for(let i=0;i<out.length;i+=8192)txt+=String.fromCharCode(...out.subarray(i,i+8192));
   if(/\bBT\b|\s[mMlL]\s|\sRG\b/.test(txt))content.push(txt);
  }catch(_){/* Certains flux PDF compressés ne sont pas du contenu lisible. */}
 }
 const measurements=[];
 function decodePdfGlyphs(hex){
  if(hex.length%4)return '';
  let res='';
  for(let i=0;i<hex.length;i+=4){
   const n=parseInt(hex.slice(i,i+4),16);
   // Un sous-ensemble des plans CAD emploie une police Identity-H
   // avec des glyphes ASCII décalés de 29 positions. Lorsqu'elle
   // n'est pas reconnue, cette méthode ne prétend pas extraire le texte.
   if(n===0xF0)res+='²';
   else if(n>=3&&n<=0x61)res+=String.fromCharCode(n+29);
   else res+='?';
  }
  return res;
 }
 const extractedTexts=[];
 for(const txt of content){
  const re=/\bBT\b([\s\S]*?)\bET\b/g;let m;
  while((m=re.exec(txt))){
   const g=m[1];const pos=/([-+\d.]+)\s+([-+\d.]+)\s+([-+\d.]+)\s+([-+\d.]+)\s+([-+\d.]+)\s+([-+\d.]+)\s+Tm/.exec(g);
   const hex=/<([0-9a-fA-F]+)>\s*Tj/.exec(g);
   const literal=/\(([^)]{1,32})\)\s*Tj/.exec(g);
   const value=hex?decodePdfGlyphs(hex[1]):literal?.[1]||'';
   if(value)extractedTexts.push(value);
   const n=/(\d{1,2}(?:[.,]\d{1,2})?)/.exec(value);
   if(n){
    const num=Number(n[1].replace(',','.'));
    if(Number.isFinite(num)&&num>0)measurements.push({num,value,x:pos?Number(pos[5]):null,y:pos?Number(pos[6]):null,vertical:pos?Math.abs(Number(pos[2]))>Math.abs(Number(pos[1])):false});
   }
  }
 }
 // Ne compter les murs que lorsqu'un nombre est explicitement annoncé
 // dans le texte du PDF (par ex. « 3 murs recouverts de tissu blanc »).
 const textContent=extractedTexts.join(' ').replace(/\s+/g,' ').trim();
 const declared=/\b([1-9]\d?)\s+(murs?|parois?)\s+(?:recouverts?|existants?|en\s+place|prévus?|prevus?)\b/i.exec(textContent)
  || /\b([1-9]\d?)\s+(murs?|parois?)\b/i.exec(textContent);
 const declaredWallCount=declared&&Number(declared[1])>=1&&Number(declared[1])<=26?Number(declared[1]):null;
 const declaredCountEvidence=declared ? ((/\b[1-9]\d?\s+murs?\s+recouverts?\s+de\s+tissu\s+blanc/i.exec(textContent)?.[0]) || declared[0]) : '';
 // Certaines lettres des PDF CAO sont des tracés vectoriels ; l'analyse ne les invente pas.
 const lengths=measurements.filter(x=>/^\d+(?:[.,]\d+)?$/.test(x.value)&&x.num>=0.6&&x.num<=20);
 const areas=measurements.filter(x=>/m(?:²|\?)/.test(x.value)&&x.num>2&&x.num<=100);

 // Lecture géométrique des longs tracés droits du PDF (PDF vectoriel seulement).
 const lineSegments=[];
 for(const txt of content){
  let previous=null;
  for(const line of txt.split(/\r?\n/)){
   const t=line.trim();
   const m=/^(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)\s+m$/.exec(t);
   const l=/^(-?\d+(?:\.\d+)?)\s+(-?\d+(?:\.\d+)?)\s+l$/.exec(t);
   if(m){previous={x:Number(m[1]),y:Number(m[2])};continue;}
   if(l&&previous){
    const end={x:Number(l[1]),y:Number(l[2])};
    const dx=Math.abs(end.x-previous.x),dy=Math.abs(end.y-previous.y);
    if((dx>500&&dy<10)||(dy>500&&dx<10))lineSegments.push({axis:dx>dy?'horizontal':'vertical',len:Math.max(dx,dy),start:previous,end});
    previous=end;continue;
   }
   if(/^(S|s|h|f|f\*|B|b)$/.test(t))previous=null;
  }
 }
 const seen=new Set();const proposed=[];
 const add=(name,cm,evidence,checked=true)=>{if(!Number.isFinite(cm)||cm<50||cm>2500)return;const key=Math.round(cm);if(seen.has(key))return;seen.add(key);proposed.push({label:name,cm:Math.round(cm*10)/10,evidence,checked})};
 // Les cotes sont proposées comme HYPOTHÈSES, car des lignes d'éclairage,
 // de menuiserie et des retours ne sont pas forcément des murs d'accrochage.
 const vertical=lengths.filter(x=>x.vertical).sort((a,b)=>b.num-a.num);
 const area=areas.find(x=>x.num>=10&&x.num<=50);
 // Les profondeurs annotées 3,00 m sont prioritaires lorsqu'elles existent :
 // elles décrivent souvent la profondeur totale du stand, alors qu'une cote
 // supérieure (p.ex. 3,25) peut désigner un segment ou une cloison.
 const depthCandidates=vertical.filter(x=>x.num>=2.5&&x.num<=6);
 const depth=depthCandidates.find(x=>Math.abs(x.num-3)<.015)
  ||depthCandidates.find(x=>Math.abs(x.num-4)<.015)
  ||depthCandidates[0]
  ||lengths.find(x=>x.num>=2.5&&x.num<=6);
 if(area&&depth){
  const width=area.num/depth.num;
  if(width>=2&&width<=20) add('Longue paroi possible',width*100,`Longueur ESTIMÉE : ${area.num.toLocaleString('fr-FR')} m² ÷ ${depth.num.toLocaleString('fr-FR')} m = ${width.toLocaleString('fr-FR',{maximumFractionDigits:2})} m. Confirmer sur le plan.`);
 }
 for(const v of vertical.filter(v=>v.num>=2.5&&v.num<=10).slice(0,4)){
  add(`Côté coté — ${v.value} m`,v.num*100,`Cote verticale « ${v.value} » relevée sur le PDF. À vérifier : mur, retour ou ligne de cote ?`);
 }
 if(proposed.length<4){
  const extra=lengths.filter(x=>x.num>=2.5&&x.num<=6.5&&/[.,]/.test(x.value)).sort((a,b)=>b.num-a.num);
  for(const v of extra){if(proposed.length>=4)break;add('Segment coté — à qualifier',v.num*100,`Cote « ${v.value} » extraite du PDF : vérifier s'il s'agit bien d'un mur, et non de la menuiserie.`,false);}
 }
 if(declaredWallCount){
  // Le nombre de murs est une information explicite, mais l'attribution
  // de cotes à chaque paroi reste incertaine. Ne créer jamais en silence.
  const candidates=[];
  for(let i=0;i<declaredWallCount;i++){
   const p=proposed[i];
   candidates.push({label:`Mur ${i+1} — à identifier`,cm:p?p.cm:'',
    evidence:p?`${p.label}. ${p.evidence}`:'Aucune longueur fiable associée à cette paroi : mesure à renseigner.',checked:true});
  }

   message:`Le document indique ${declaredWallCount} mur(s). J'ai proposé ${declaredWallCount} fiches de mur. Vérifie leurs dimensions et leur correspondance sur le dessin avant création.`};
 }
 return {state:'ready',candidates:proposed.slice(0,5),message:proposed.length?`${proposed.length} longueur(s) possible(s) retrouvée(s). Le PDF ne permet pas de certifier à lui seul quelles lignes sont des murs. Choisis uniquement les parois d'accrochage.`:'Aucune cote de mur exploitable reconnue. Les textes peuvent être dessinés en contours dans ce PDF.'};

async function parsePhotoPlan(data){
 const img=new Image();img.src=data;
 await new Promise((resolve,reject)=>{if(img.complete&&img.naturalWidth)resolve();else{img.onload=resolve;img.onerror=reject;}});
 const scale=Math.min(1,700/Math.max(img.naturalWidth,img.naturalHeight));
 const w=Math.round(img.naturalWidth*scale),h=Math.round(img.naturalHeight*scale);
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d',{willReadFrequently:true});ctx.fillStyle='white';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
 const dat=ctx.getImageData(0,0,w,h).data;const g=new Uint8Array(w*h);
 for(let i=0;i<w*h;i++){const k=i*4;g[i]=(dat[k]*30+dat[k+1]*59+dat[k+2]*11)/100;}
 const candidates=[];
 function peak(axis){
  const count=axis==='h'?h:w,span=axis==='h'?w:h,scores=[];
  for(let at=8;at<count-8;at+=2){let n=0,vis=0;
   for(let t=Math.round(span*.1);t<span*.9;t+=3){const x=axis==='h'?t:at,y=axis==='h'?at:t;
    const p=y*w+x,near=axis==='h'?p-w:p-1;
    if(g[p]<125){vis++;if(Math.abs(g[p]-g[near])>45)n++;}
   }
   scores.push({at,score:n+vis*.15});
  }
  const out=[];const best=[...scores].sort((a,b)=>b.score-a.score);
  for(const cand of best){if(out.length>=2)break;if(cand.score<5)break;if(out.every(a=>Math.abs(a.at-cand.at)>Math.min(count*.12,60)))out.push(cand);}
  return out;
 }
 const horizontal=peak('h'),vertical=peak('v');
 for(const [kind,arr] of [['horizontal',horizontal],['vertical',vertical]]){
  for(let i=0;i<arr.length;i++)candidates.push({label:`Tracé ${kind} ${i+1}`,cm:'',evidence:'Ligne probable détectée sur la photo : aucune longueur certaine. Renseigne la cote en cm.',checked:true});
 }
 return {state:'ready',candidates:candidates.slice(0,5),message:candidates.length?`${candidates.length} tracé(s) probable(s) repéré(s). Sur une photo, la perspective et les annotations demandent une mesure manuelle.`:'Aucune ligne de mur suffisamment nette détectée. Utilise une photo bien de face ou un PDF vectoriel.'};
}
async function analyzeImportedPlan(wallId,fileOrNull){
 const wall=s.walls.find(w=>w.id===wallId);if(!wall?.importedPlan)return;
 wall.importedPlan.analysis={state:'loading',candidates:[]};
 if(s.currentWallId===wallId){s.importedPlan=wall.importedPlan;draw();}
 try{
  let result;
  if(wall.importedPlan.kind==='pdf'){
   let file=fileOrNull;
   if(!file){const b=atob(wall.importedPlan.data.split(',')[1]);const arr=new Uint8Array(b.length);for(let i=0;i<b.length;i++)arr[i]=b.charCodeAt(i);file=new Blob([arr],{type:'application/pdf'});}
   result=await parsePdfPlan(file);
  }else result=await parsePhotoPlan(wall.importedPlan.data);
  wall.importedPlan.analysis=result;
 }catch(err){wall.importedPlan.analysis={state:'ready',candidates:[],message:'Analyse automatique impossible : '+String(err?.message||err).slice(0,120)+'. Le document reste consultable.'};}
 if(s.currentWallId===wallId){s.importedPlan=wall.importedPlan;draw();}
}
function createRecognizedWalls(){

 if(Number.isInteger(r.declaredWallCount)&&chosen.length!==r.declaredWallCount){recognitionError=`Le PDF indique ${r.declaredWallCount} murs. Pour créer les murs annoncés, sélectionne les ${r.declaredWallCount} propositions.`;draw();return;}
 if(chosen.some(c=>c.cm===''||!Number.isFinite(Number(c.cm))||Number(c.cm)<50||Number(c.cm)>2500)){
  recognitionError='Confirme chaque longueur sélectionnée en centimètres (entre 50 et 2 500).';draw();return;
 }
 syncActiveWall();
 const baseHeight=s.wallH||300;
 const max=26-s.walls.length;
 const canReuse=s.arts.length===0;
 if(chosen.length>max+(canReuse?1:0)){recognitionError='Limite de 26 murs atteinte. Désélectionne des propositions.';draw();return;}
 const original=s.currentWallId;const made=[];
 for(const c of chosen){
  let id,name;
  if(canReuse&&made.length===0){id=original;const wall=s.walls.find(w=>w.id===id);wall.wallW=Number(c.cm);wall.wallH=baseHeight;made.push(id);continue;}
  let i=0;do{id=String.fromCharCode(65+i++);}while(s.walls.some(w=>w.id===id)&&i<26);
  if(s.walls.some(w=>w.id===id))break;
  name=`Mur ${id}`;
  s.walls.push({id,name,wallW:Number(c.cm),wallH:baseHeight,desiredGap:10,showFixings:true,heightOpen:false,centerOpen:false,centerHeight:150,centerScope:'all',bottomOpen:false,bottomHeight:110,bottomScope:'one',selected:null,arts:[],importedPlan:null});
  made.push(id);
 }
 r.applied=true;
 recognitionError='';
 if(made.length){const target=s.walls.find(w=>w.id===made[0]);loadWall(target);s.tab='plan';}

}

function importPlanFile(file,source){
 if(!file)return;

 const pdf=file.type==='application/pdf'||ext.endsWith('.pdf');
 const image=!pdf&&(file.type.startsWith('image/')||/\.(heic|heif|jpe?g|png|webp)$/i.test(ext));
 if(!pdf&&!image){alert('Choisis une photo ou un fichier PDF.');return;}
 if(file.size>10*1024*1024){alert('Fichier trop volumineux (maximum 10 Mo).');return;}
 const wallId=s.currentWallId;

 reader.onload=()=>{
  const data=reader.result;
  const target=s.walls.find(w=>w.id===wallId);
  if(!target)return;
  function save(plan){target.importedPlan=plan;recognitionError='';if(s.currentWallId===wallId){s.importedPlan=plan;importChoicesOpen=false;importPreviewOpen=plan.kind==='image';draw();}analyzeImportedPlan(wallId,file).catch(()=>{});}
  if(pdf){save({name:file.name||'Plan.pdf',kind:'pdf',data});return;}
  const img=new Image();

   try{
    const max=1700,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement('canvas');
    cv.width=Math.max(1,Math.round(img.naturalWidth*scale));
    cv.height=Math.max(1,Math.round(img.naturalHeight*scale));
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);
    save({name:file.name||'Photo du plan',kind:'image',data:cv.toDataURL('image/jpeg',0.85)});
   }catch(e){save({name:file.name||'Photo du plan',kind:'image',data});}
  };
  img.onerror=()=>alert('Cette photo ne peut pas être affichée. Essaie de la convertir en JPEG.');
  img.src=data;
 };
 reader.readAsDataURL(file);
}

const f=n=>Number(Number(n).toFixed(1)).toLocaleString('fr-FR',{maximumFractionDigits:1});

const heightsFromPlan=a=>({vis:s.wallH-a.y-a.top,mid:s.wallH-a.y-a.h/2});
// Chaque point est calculé à partir du cadre : distances en cm.
// Quatre points = deux colonnes gauche/droite, deux rangées haute/basse.
// En l'absence de cote du bas, la seconde rangée reste explicitement indéterminée.
function fixingPoints(a){
 const w=Math.max(1,Number(a.w)||1),h=Math.max(1,Number(a.h)||1);
 const edge=Math.max(0,Math.min(w/2,Number(a.edge)||0));
 const top=Number.isFinite(Number(a.top))?Math.max(0,Math.min(h,Number(a.top))):null;
 const l=Number(a.x)+edge,r=Number(a.x)+w-edge,mid=Number(a.x)+w/2;
 const point=(name,x,offset,position)=>({name,x,offset,position});
 if(a.points===1)return [point('Point 1',mid,top,'haut')];
 if(a.points===3)return [point('Point 1',l,top,'haut'),point('Point 2',mid,top,'haut'),point('Point 3',r,top,'haut')];
 if(a.points===4){
  const bottomRaw=a.bottomOffset;
  const bottom=bottomRaw!==''&&bottomRaw!==null&&bottomRaw!==undefined&&Number.isFinite(Number(bottomRaw))&&Number(bottomRaw)>=0&&Number(bottomRaw)<=h?h-Number(bottomRaw):null;
  return [point('Haut gauche',l,top,'haut'),point('Haut droit',r,top,'haut'),point('Bas gauche',l,bottom,'bas'),point('Bas droit',r,bottom,'bas')];
 }
 return [point('Point 1',l,top,'haut'),point('Point 2',r,top,'haut')];
}
const holeXs=a=>[...new Set(fixingPoints(a).map(p=>p.x))];
function fixWarnings(a){
 const messages=[];
 if(a.points===4){
  if(a.bottomOffset===''||a.bottomOffset===undefined||a.bottomOffset===null)messages.push('Points bas : saisis la distance entre le bas du cadre et les attaches basses pour calculer leurs hauteurs.');
  else if(Number(a.bottomOffset)<0||Number(a.bottomOffset)>a.h)messages.push('La distance des attaches basses doit rester dans la hauteur du cadre.');
  else if(Number(a.top)>=a.h-Number(a.bottomOffset))messages.push('Vérifie les positions des rangées : les points hauts et bas se rejoignent ou se croisent.');
 }
 if(a.points==='rail')messages.push('Rail : les deux positions affichées sont indicatives ; vérifier les points de fixation réels du rail.');
 return messages;
}
function fixingMarkup(a){

  const x=((p.x-a.x)/a.w)*100;
  const y=p.offset===null?(p.position==='bas'?83:14):p.offset/a.h*100;

 }).join('');
}

function works(){return `<div class="bar"><strong>Mes œuvres</strong><button class="btn primary" data-act="add">＋ Ajouter</button></div><p class="hint">Sélectionne une œuvre pour modifier ses dimensions. Le plan se met à jour.</p>${s.arts.length?`<div class="cards">${s.arts.map(a=>`<div class="card ${s.selected===a.id?'selected':''}"><div class="cardtop"><strong>${a.name}</strong><div class="row"><button class="btn ${a.id===s.selected?'active':''}" data-act="select" data-id="${a.id}">${a.id===s.selected?'Sélectionnée':'Choisir'}</button><button class="btn danger" data-act="askDelete" data-id="${a.id}">Supprimer</button></div></div>${s.deleteId===a.id?`<p class="hint">Supprimer ${a.name} du mur ?</p><div class="actions"><button class="btn danger" data-act="confirmDelete" data-id="${a.id}">Oui, supprimer</button><button class="btn" data-act="cancelDelete">Annuler</button></div>`:''}${a.id===s.selected?`<div class="work-edit-top"><div class="work-dims"><div class="row work-dims-row">${field('Largeur (cm)','w',a.w)}${field('Hauteur (cm)','h',a.h)}</div></div><div class="photo-side"><strong>Photo de l’œuvre</strong>${a.photo?`<img class="photo-preview" src="${a.photo}" alt="Aperçu de ${a.name}">`:'<p class="hint">Ajoute la photo de cette œuvre pour la voir sur le mur.</p>'}<div class="photo-picker"><label class="btn" for="photo-camera-${a.id}">📷 Prendre une photo</label><input id="photo-camera-${a.id}" type="file" accept="image/*" capture="environment" data-photo="${a.id}"><label class="btn" for="photo-file-${a.id}">▧ Choisir une photo</label><input id="photo-file-${a.id}" type="file" accept="image/*" data-photo="${a.id}">${a.photo?`<button class="btn" data-act="removePhoto" data-id="${a.id}">Enlever la photo</button>`:''}</div></div></div>`:`<div class="small">${f(a.w)} × ${f(a.h)} cm${a.photo?' · Photo ajoutée':''}</div>`}</div>`).join('')}</div>`:'<p class="hint">Aucune œuvre. Appuie sur « Ajouter » pour recommencer.</p>'}<button class="btn primary" data-act="plan">Voir le plan →</button>`}
function attachSchema(a){

 <div class="attach-points">${options.map(p=>`<button class="btn ${p===a.points?'active':''}" data-act="points" data-id="${attachBtnValue(p)}">${attachLabel(p)}</button>`).join('')}</div>

 <div class="square" style="text-align:center"><div id="attach-schema">${attachSchema(a)}</div><div class="small">Schéma indicatif : les quatre points sont sur deux rangées</div></div>

function drill(){
 if(s.siteMode)return sitePanel();
 const a=art();if(!a)return `<p class="hint">Ce mur ne contient pas d’œuvre. Ajoute une œuvre dans l’onglet Œuvres.</p><div class="actions"><button class="btn" data-act="exportPdf">PDF coté du mur</button><button class="btn" data-act="siteMode">Mode chantier</button></div>`;
 const points=fixingPoints(a),hs=heightsFromPlan(a),xs=holeXs(a);const bottomPoint=a.points===4?points.find(p=>p.position==='bas'&&p.offset!==null):null;

 <p class="hint">Ces hauteurs proviennent du placement sur le plan ; elles ne sont pas une mesure validée sur chantier. Elles sont facultatives. ${a.points===4?(bottomPoint?`Vis rangée basse : ${f(s.wallH-a.y-bottomPoint.offset)} cm, indicatif d’après le plan.`:'La hauteur des points bas nécessite leur cote spécifique.'):''}</p></div>
 <div class="actions"><button class="btn" data-act="attach">← Modifier les attaches</button><button class="btn" data-act="plan">Voir le mur</button><button class="btn primary" data-act="siteMode">☑ Mode chantier</button><button class="btn" data-act="exportPdf">▧ PDF coté du mur</button></div>

 <p class="hint">Avant tout perçage, contrôle les mesures, la nature du mur, la charge et la résistance des fixations.</p>`;
}
function sitePanel(){

 <div class="card"><strong>Parcours de perçage · dernier point → suivant</strong><p class="hint">Départ au bord gauche, puis mesure toujours depuis le point précédent. Les hauteurs restent indicatives.</p><div class="site-route">${routeMarkup||'<p class="hint">Aucun point sur ce mur.</p>'}</div></div>
 <div class="card"><div class="small">Suivi des œuvres pour ce mur, sans modifier leurs mesures.</div><div class="site-progress"><div style="width:${pct}%"></div></div>

  const xs=holeXs(a),warn=fixWarnings(a).length>0;

 }).join(''):'<p class="hint">Aucune œuvre sur ce mur.</p>'}</div>

// Parcours chantier : chaque nouvelle mesure part du dernier point réel.
// Les références absolues X et les hauteurs Y restent des valeurs de contrôle.
function printEsc(v){return safeText(v);}
function plannedHeight(H,a,p){
 return p.offset===null||p.offset===undefined||!Number.isFinite(Number(p.offset))?null:H-Number(a.y)-Number(p.offset);
}
function drillingRoute(w){
 const H=Number(w.wallH)||300;
 const sorted=[...(w.arts||[])].sort((a,b)=>a.x-b.x);
 const result=[];
 for(const a of sorted){
  const pts=fixingPoints(a);
  // Pour 4 points, déplacement dans le sens des aiguilles d'une montre.
  const order=a.points===4?[pts[0],pts[1],pts[3],pts[2]]:pts;
  for(const point of order){
   const prev=result.length?result[result.length-1]:null;
   const y=plannedHeight(H,a,point);
   const dx=point.x-(prev?prev.x:0);
   const dy=prev&&y!==null&&prev.y!==null?y-prev.y:null;
   result.push({n:result.length+1,a,point,x:point.x,y,dx,dy,prev,sameWork:!!prev&&prev.a===a,sameRow:!!prev&&prev.a===a&&prev.point.position===point.position});
  }
 }
 return result;
}
function horizontalInstruction(step){
 const d=Number(step.dx);
 const direction=Math.abs(d)<.00001?'même verticale':`${f(Math.abs(d))} cm ${d>0?'à droite':'à gauche'}`;
 if(!step.prev)return `Depuis le bord gauche du mur : ${direction}`;
 if(step.sameWork&&step.sameRow)return `Depuis le point ${step.prev.n} : entraxe ${direction}`;
 return `Depuis le point ${step.prev.n} : ${direction}`;
}
function verticalInstruction(step){
 if(!step.prev)return 'Départ : hauteur du point ci-contre';
 if(step.dy===null)return 'À confirmer (hauteur manquante)';
 if(Math.abs(step.dy)<.00001)return 'Même hauteur';
 return `${f(Math.abs(step.dy))} cm ${step.dy>0?'plus haut':'plus bas'} · selon le plan`;
}
function printWall(w){
 const W=Number(w.wallW)||600,H=Number(w.wallH)||300;
 const arts=[...(w.arts||[])].sort((a,b)=>a.x-b.x);
 const route=drillingRoute(w);
 const gapVals=[];let edge=0;for(const a of arts){gapVals.push(a.x-edge);edge=a.x+a.w;}gapVals.push(W-edge);
 // Garder une marge droite pour la cote verticale générale du mur.
 const scale=Math.min(920/W,270/H),drawingW=W*scale,drawingH=H*scale,x0=(1000-drawingW)/2,y0=34;
 const X=x=>x0+x*scale,Y=y=>y0+y*scale;
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 392" role="img" aria-label="Élévation cotée ${printEsc(w.name)}">
 <rect x="${X(0)}" y="${Y(0)}" width="${drawingW}" height="${drawingH}" fill="#fff" stroke="#526579" stroke-width="1.5"/>
 <line x1="${X(W/2)}" y1="${Y(0)}" x2="${X(W/2)}" y2="${Y(H)}" stroke="#bcc9d0" stroke-dasharray="6 6"/>
 <text x="${X(W/2)}" y="20" font-size="15" text-anchor="middle" fill="#315d65">Largeur : ${printEsc(f(W))} cm</text>
 <line x1="${X(W)+16}" y1="${Y(0)}" x2="${X(W)+16}" y2="${Y(H)}" stroke="#1b7663" stroke-width="1.5"/>
 <line x1="${X(W)+9}" y1="${Y(0)}" x2="${X(W)+23}" y2="${Y(0)}" stroke="#1b7663"/>
 <line x1="${X(W)+9}" y1="${Y(H)}" x2="${X(W)+23}" y2="${Y(H)}" stroke="#1b7663"/>
 <text x="${X(W)+34}" y="${Y(H/2)}" font-size="14" text-anchor="middle" transform="rotate(-90 ${X(W)+34} ${Y(H/2)})" fill="#1b7663">Hauteur : ${printEsc(f(H))} cm</text>
 ${arts.map(a=>{
  const aX=X(a.x),aY=Y(a.y),aW=a.w*scale,aH=a.h*scale;
  return `<rect x="${aX}" y="${aY}" width="${aW}" height="${aH}" fill="#f0e7d8" stroke="#313a46" stroke-width="3"/>
  ${a.photo?`<image href="${a.photo}" x="${aX+2}" y="${aY+2}" width="${Math.max(aW-4,1)}" height="${Math.max(aH-4,1)}" preserveAspectRatio="xMidYMid meet"/>`:''}
  <text x="${aX+aW/2}" y="${Math.min(y0+drawingH+17,aY+aH+14)}" text-anchor="middle" font-size="11" fill="#1c5475">${printEsc(a.name)}</text>`;
 }).join('')}
 ${route.filter(r=>r.y!==null).map(r=>`<g stroke="#c73542" stroke-width="1.8"><line x1="${X(r.x)-5}" y1="${Y(r.a.y+r.point.offset)}" x2="${X(r.x)+5}" y2="${Y(r.a.y+r.point.offset)}"/><line x1="${X(r.x)}" y1="${Y(r.a.y+r.point.offset)-5}" x2="${X(r.x)}" y2="${Y(r.a.y+r.point.offset)+5}"/></g>`).join('')}
 ${arts.length?gapVals.map((g,i)=>{
  const left=i===0?0:arts[i-1].x+arts[i-1].w,right=i===arts.length?W:arts[i].x;
  if(right-left<0)return '';
  return `<line x1="${X(left)}" y1="${y0+drawingH+32}" x2="${X(right)}" y2="${y0+drawingH+32}" stroke="#1b7663"/>
  <text x="${X((left+right)/2)}" y="${y0+drawingH+47}" font-size="11" text-anchor="middle" fill="#1b7663">${printEsc(f(g))} cm</text>`;
 }).join(''):''}</svg>`;
 const heightRows=arts.map(a=>{
  const points=fixingPoints(a);const top=points.find(p=>p.position==='haut');const bottom=points.find(p=>p.position==='bas');
  const topH=top?plannedHeight(H,a,top):null;
  const bottomH=bottom?plannedHeight(H,a,bottom):null;
  const middle=H-Number(a.y)-Number(a.h)/2;
  return `<tr><td><strong>${printEsc(a.name)}</strong><span class="subinfo">${printEsc(f(a.w))} × ${printEsc(f(a.h))} cm</span></td><td>${printEsc(f(middle))} cm</td><td>${topH===null?'À relever':printEsc(f(topH))+' cm'}</td><td>${!bottom?'—':bottomH===null?'À relever':printEsc(f(bottomH))+' cm'}</td></tr>`;
 }).join('');
 const routeRows=route.map(r=>`<tr>
 <td class="num">${r.n}</td>
 <td><strong>${printEsc(r.a.name)}</strong><span class="subinfo">${printEsc(r.point.name)}</span></td>
 <td class="step"><strong>${printEsc(horizontalInstruction(r))}</strong></td>
 <td>${printEsc(verticalInstruction(r))}</td>
 <td>${printEsc(f(r.x))} cm</td>
 <td>${r.y===null?'À relever':printEsc(f(r.y))+' cm'}${r.y!==null?'<span class="subinfo">selon plan</span>':''}</td>
 </tr>`).join('');
 return `<section class="page"><header><h1>Ridfou Expo · ${printEsc(w.name)}</h1><p>Plan coté d'accrochage · Vue de face · Mur ${f(W)} × ${f(H)} cm</p></header>
 <div class="drawing">${svg}</div>
 <div class="print-heights"><h2>Hauteurs depuis le sol — d'après le plan, à confirmer sur chantier</h2>
 <table class="heights"><thead><tr><th>Œuvre (L × H)</th><th>Milieu</th><th>Vis haute</th><th>Vis basse</th></tr></thead><tbody>${heightRows||'<tr><td colspan="4">Aucune œuvre sur ce mur</td></tr>'}</tbody></table></div>
 <h2>Ordre de perçage — toujours depuis le dernier point</h2>
 <p class="route-intro">Commencer au bord gauche pour le 1er point. Ensuite, chaque déplacement part du dernier trou percé. Les distances verticales sont facultatives et calculées d'après le plan.</p>
 <table class="route"><thead><tr><th>N°</th><th>Œuvre / point</th><th>Déplacement horizontal</th><th>Déplacement vertical</th><th>Contrôle X<br>depuis gauche</th><th>Hauteur du point<br>depuis sol</th></tr></thead><tbody>${routeRows||'<tr><td colspan="6">Aucun point à percer</td></tr>'}</tbody></table>
 <p class="warning">Cotes en cm. Les hauteurs et les décalages verticaux proviennent du placement dans le plan, non d'une mesure de chantier confirmée. Pour 4 points, toute hauteur basse non renseignée reste « À relever ». Avant perçage, vérifier l'œuvre, le mur, les fixations, les entraxes et la référence de départ.</p></section>`;
}

function ridfouMakePdf(walls){
  const pages=[];

  let pageNo=0;
  function title(w,label){

    let top=tableHeader(pos),bottom=top;
    if(!rows.length){bottom-=29;txt(52,bottom+10,'Aucune oeuvre sur ce mur',9,false,muted);}
    for(const row of rows){

      rect(44,bottom-27,753,27,[1,1,1],[.78,.83,.88],.5);
      [col[1],col[2],col[3]].forEach(v=>line(v,bottom-27,v,bottom,[.78,.83,.88],.5));
      txt(50,bottom-11,row[0],8.8,true,ink);
      txt(50,bottom-22,row[1]+' cm',7.4,false,muted);
      txt(col[1]+6,bottom-15,row[2],9,false,ink);
      txt(col[2]+6,bottom-15,row[3],9,false,ink);
      txt(col[3]+6,bottom-15,row[4],9,false,ink);
      bottom-=27;
    }
    if(bottom>65){
      multi(44,Math.max(54,bottom-17),'Attention : ces hauteurs proviennent du plan numerique. Elles ne sont pas une mesure confirmee sur chantier.',750,8,false,[.56,.33,.19]);
    }
  }
  function routePages(w){
    const route=drillingRoute(w);
    if(!route.length)return;
    let k=0;
    const cols=[44,76,199,407,551,672,797],widths=cols.slice(1).map((v,i)=>v-cols[i]);
    while(k<route.length){
      title(w,'Parcours de percage - chaque mesure depuis le dernier point');
      multi(44,498,'Commencer par le 1er point depuis le bord gauche ; ensuite, toujours partir du dernier trou perce. Horizontal prioritaire. Toutes les distances sont en cm.',751,9,false,muted);
      const th=451;
      rect(44,th,753,35,pale,[.75,.82,.89],.6);
      const labels=['No','Oeuvre / point','Deplacement horizontal','Deplacement vertical','Controle X\ndepuis gauche','Hauteur du point\ndepuis sol'];
      labels.forEach((lab,i)=>{
        lab.split('\n').forEach((s,j)=>txt(cols[i]+5,th+22-j*10,s,8.5,true,ink));

  for(let i=1;i<objects.length;i++)binary+=`${String(offsets[i]).padStart(10,'0')} 00000 n \n`;

  return new Blob([new TextEncoder().encode(binary)],{type:'application/pdf'});
}
function ridfouPdfFilename(walls){
  const name=walls.length===1?String(walls[0]?.name||'Mur'):'Tous-les-murs';
  return 'Ridfou-Expo-'+name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9_-]+/g,'-')+'.pdf';
}
function ridfouClosePdfDialog(){
  if(!ridfouExportDialog)return;
  const overlay=ridfouExportDialog.overlay;
  overlay.remove();
  document.body.style.removeProperty('--ridfou-export-is-open');
  if(ridfouExportDialog.url)URL.revokeObjectURL(ridfouExportDialog.url);
  const focusTarget=ridfouExportDialog.focusTarget;
  ridfouExportDialog=null;
  if(focusTarget&&focusTarget.isConnected)focusTarget.focus();
}
function ridfouDownloadPdf(){
  const state=ridfouExportDialog;if(!state)return;
  // Sur iPhone/iPad installé en PWA, privilégier la feuille de partage native :
  // elle permet d'enregistrer dans Fichiers sans dépendre du téléchargement d'un blob.
  const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||
    (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(isiOS&&navigator.share&&navigator.canShare){
    const file=new File([state.blob],state.filename,{type:'application/pdf'});
    if(navigator.canShare({files:[file]})){ridfouSharePdf();return;}
  }
  const anchor=document.createElement('a');anchor.href=state.url;anchor.download=state.filename;
  anchor.style.display='none';document.body.appendChild(anchor);anchor.click();anchor.remove();
  const hint=state.overlay.querySelector('.ridfou-export-help');
  if(hint)hint.textContent="Si le téléchargement ne s'affiche pas, utilise « Partager / Imprimer », puis « Enregistrer dans Fichiers ».";
}
async function ridfouSharePdf(){
  const state=ridfouExportDialog;if(!state)return;
  const hint=state.overlay.querySelector('.ridfou-export-help');
  const file=new File([state.blob],state.filename,{type:'application/pdf'});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file],title:'Ridfou Expo - Plan cote'});
    }catch(e){
      if(e?.name!=='AbortError'&&hint)hint.textContent="Le partage a échoué. Essaye « Enregistrer PDF » ou ouvre le site dans Safari.";
    }
  }else if(hint){
    hint.textContent="Le partage de fichiers n'est pas disponible ici. Appuie sur « Enregistrer PDF » ; si besoin ouvre Ridfou Expo dans Safari.";
  }
}
function exportPdf(all){
  syncActiveWall();
  const walls=all?s.walls:s.walls.filter(w=>w.id===s.currentWallId);
  if(!walls.length){alert('Aucun mur disponible.');return;}
  ridfouClosePdfDialog();
  let blob;
  try{blob=ridfouMakePdf(walls);}catch(e){console.error('Export PDF impossible',e);alert('Impossible de créer le PDF. Les données sont conservées.');return;}
  const filename=ridfouPdfFilename(walls);
  const url=URL.createObjectURL(blob);
  const overlay=document.createElement('div');
  overlay.id='ridfou-export-dialog';
  overlay.setAttribute('role','dialog');
  overlay.setAttribute('aria-modal','true');
  overlay.setAttribute('aria-label','Exporter le plan coté de Ridfou Expo');
  overlay.innerHTML=`<div class="ridfou-export-toolbar"><button type="button" class="ridfou-export-back" data-pdf-action="close">← Retour à Ridfou Expo</button><strong>Plan coté · PDF</strong></div>
    <div class="ridfou-export-actions"><button type="button" class="ridfou-export-primary" data-pdf-action="share">Partager / Imprimer</button><button type="button" data-pdf-action="download">Enregistrer PDF</button></div>
    <p class="ridfou-export-help">Sur iPhone, « Partager / Imprimer » ouvre les options « Enregistrer dans Fichiers » et « Imprimer ».</p>
    <div class="ridfou-export-framebox"><iframe title="Aperçu du plan coté" loading="eager"></iframe></div>
    <div class="ridfou-export-bottom"><button type="button" data-pdf-action="close">← Retour à mon exposition</button></div>`;
  const focusTarget=document.activeElement;
  document.body.appendChild(overlay);
  document.body.style.setProperty('--ridfou-export-is-open','1');
  ridfouExportDialog={overlay,blob,filename,url,focusTarget};
  // L'aperçu reste dans Ridfou Expo : aucun nouvel onglet ni fenêtre sans navigation.
  const frame=overlay.querySelector('iframe');
  const preview=printDocument(walls).replace(/<nav>[\s\S]*?<\/nav>/,'');
  frame.addEventListener('load',()=>{
    // Ajuster l'aperçu paysage à la largeur d'un iPhone, sans tronquer les cotes.
    try{
      const inner=frame.contentDocument;
      if(!inner)return;
      const scale=Math.min(1,Math.max(.25,(frame.clientWidth-24)/1060));
      inner.body.style.width='1060px';
      inner.body.style.zoom=String(scale);
      inner.body.style.margin='0';
      inner.querySelectorAll('.page').forEach(p=>{p.style.width='1030px';p.style.maxWidth='none';p.style.margin='12px auto';});
    }catch(_){/* L'aperçu n'affecte pas l'export du PDF. */}
  });
  frame.srcdoc=preview.replace('</style>','nav{display:none!important}body{background:#f7f4ec}.page{width:100%;max-width:1100px} @media(max-width:800px){.page{min-width:850px}}</style>');
  overlay.querySelectorAll('[data-pdf-action]').forEach(b=>b.addEventListener('click',e=>{
    const op=b.dataset.pdfAction;
    if(op==='close')ridfouClosePdfDialog();
    else if(op==='download')ridfouDownloadPdf();
    else if(op==='share')ridfouSharePdf();
  }));
  const back=overlay.querySelector('.ridfou-export-back');if(back)back.focus();
}

function applyDirectGap(index, wanted){
  const {aa,gaps}=layout();
  if(!aa.length||!Number.isInteger(index)||index<0||index>=gaps.length)return 'Aucun écart à modifier.';
  if(!Number.isFinite(wanted)||wanted<0)return 'Saisis une distance supérieure ou égale à zéro.';
  const delta = wanted-gaps[index].n, eps=0.00001;
  let moving=[], shift=0;
  if(index===aa.length){
    // Changing the right margin moves only the last artwork: other positions stay untouched.
    moving=[aa[aa.length-1]];shift=-delta;
  } else {
    // Changing an interior gap moves that artwork and every artwork after it, preserving their spacing.
    // Changing the left margin shifts the complete group.
    moving=aa.slice(index);shift=delta;
  }
  const movedIds=new Set(moving.map(a=>a.id));
  const positions=aa.map(a=>({id:a.id,x:a.x+(movedIds.has(a.id)?shift:0),w:a.w}));
  if(positions.some(a=>a.x<-eps||a.x+a.w>s.wallW+eps))return 'Distance impossible : une œuvre sortirait du mur.';
  for(let i=1;i<positions.length;i++){
    if(positions[i].x < positions[i-1].x+positions[i-1].w-eps)return 'Distance impossible : les œuvres se chevaucheraient.';
  }
  moving.forEach(a=>a.x=Math.round((a.x+shift)*1000)/1000);
  return null;
}

function applyGap(g){if(!Number.isFinite(g)||g<0)return;const aa=[...s.arts].sort((a,b)=>a.x-b.x),total=aa.reduce((v,a)=>v+a.w,0);const needed=total+g*Math.max(0,aa.length-1);if(needed>s.wallW+0.00001){alert('Les œuvres et les écarts demandés dépassent la largeur du mur.');return}let x=(s.wallW-needed)/2;for(const a of aa){a.x=x;x+=a.w+g}}

// Calculatrices indépendantes : valeurs de session sans réécrire les données des murs.
const rfCalc={hMode:'milieu',h1:'',h2:'',h3:'',wMode:'trous',w1:'',w2:'',w3:''};
function rfN(v){
 const raw=String(v??'').replace(/[\s\u00a0\u202f]/g,'').replace(',','.');
 if(!raw||!/^\d+(?:\.\d+)?$/.test(raw))return null;
 const n=Number(raw);return Number.isFinite(n)?n:null;
}
function rfF(v){return Number(v).toLocaleString('fr-FR',{maximumFractionDigits:2})}
function rfCalcHeight(){
 const ref=rfN(rfCalc.h1),dim=rfN(rfCalc.h2),a=rfN(rfCalc.h3),m=rfCalc.hMode;
 if(m==='decalage'){
  if(ref===null||dim===null)return {value:null,error:'Entre les hauteurs des deux trous.'};
  return {value:dim-ref,label:dim>ref?'Monter de '+rfF(dim-ref)+' cm':dim<ref?'Descendre de '+rfF(ref-dim)+' cm':'Même hauteur',sub:rfF(dim)+' − '+rfF(ref)+' = '+(dim-ref>0?'+':'')+rfF(dim-ref)+' cm'};
 }
 if(ref===null||a===null||(m!=='haut'&&dim===null))return {value:null,error:'Entre tes mesures pour calculer la hauteur du trou.'};
 if(m!=='haut'&&(dim<=0||a>dim))return {value:null,error:'Vérifie la hauteur de l’œuvre et la distance de l’attache.'};
 const v=ref+(m==='milieu'?dim/2:m==='bas'?dim:0)-a;
 if(v<0)return {value:null,error:'Le point de fixation serait sous le sol : vérifie les cotes.'};
 return {value:v,label:'Hauteur du trou depuis le sol',sub:m==='milieu'?rfF(ref)+' + ('+rfF(dim)+' ÷ 2) − '+rfF(a)+' = '+rfF(v)+' cm':m==='bas'?rfF(ref)+' + '+rfF(dim)+' − '+rfF(a)+' = '+rfF(v)+' cm':rfF(ref)+' − '+rfF(a)+' = '+rfF(v)+' cm'};
}
function rfCalcWidth(){
 const a=rfN(rfCalc.w1),b=rfN(rfCalc.w2),c=rfN(rfCalc.w3),m=rfCalc.wMode;
 if(m==='espaces'){
  const chunks=rfCalc.w2.split(/[+;]/).map(x=>x.trim());
  const nums=chunks.map(rfN);
  if(a===null||!rfCalc.w2.trim())return {value:null,error:'Entre la largeur du mur et les largeurs des œuvres.'};
  if(a<=0||nums.some(n=>n===null||n<=0))return {value:null,error:'Indique des largeurs positives séparées par +.'};
  const sum=nums.reduce((x,y)=>x+y,0);
  if(sum>a)return {value:null,error:'Les œuvres dépassent la largeur du mur.'};
  const v=(a-sum)/(nums.length+1);
  return {value:v,label:'Écart identique, bords du mur compris',sub:'('+rfF(a)+' − '+rfF(sum)+') ÷ '+(nums.length+1)+' = '+rfF(v)+' cm'};
 }
 if(a===null||b===null||c===null)return {value:null,error:'Entre les trois mesures pour obtenir le résultat.'};
 if(m==='entraxe'){
  if(a<=0||b+c>a)return {value:null,error:'Les retraits des attaches dépassent la largeur de l’œuvre.'};
  const v=a-b-c;
  return {value:v,label:'Entraxe horizontal des attaches',sub:rfF(a)+' − '+rfF(b)+' − '+rfF(c)+' = '+rfF(v)+' cm'};
 }
 const v=a+b+c;
 return {value:v,label:'Distance à droite depuis le dernier trou',sub:rfF(a)+' + '+rfF(b)+' + '+rfF(c)+' = '+rfF(v)+' cm'};
}
function rfCalcInput(key,label,placeholder,keyboard='decimal'){

}
function rfCalcView(){

 (hm==='haut'?'':rfCalcInput('h2',hm==='decalage'?'Hauteur du deuxième trou':'Hauteur de l’œuvre',hm==='decalage'?'Ex. 195':'Ex. 80'))+

 '<div class="calc-result" aria-live="polite"><small>Résultat vertical</small><div id="rf-h-result" class="calc-value">— cm</div><div id="rf-h-label" class="calc-label">Entre tes mesures.</div></div>'+ 
 '<div class="calc-formula-box"><div class="calc-formula-heading">Formule utilisée</div><span class="calc-formula">'+hFormula+'</span><div id="rf-h-sub" class="calc-substitution"></div><div class="calc-explain">'+(hm==='decalage'?'Si le résultat est positif, tu montes ; s’il est négatif, tu descends.':'A = distance entre le haut de l’œuvre et l’axe de son attache.')+'</div></div>'+ 
 '<div class="calc-actions"><button class="btn" data-act="clearCalc" data-which="h">↺ Effacer</button><button class="btn primary" data-act="copyCalc" data-which="h" id="rf-copy-h" disabled>Copier</button></div><div class="calc-copy-feedback" id="rf-feedback-h"></div></section>'+ 
 '<section class="calc-card"><h2 class="calc-title">↔ 2. Largeur <span class="calc-unit">cm</span></h2>'+

 rfCalcInput('w1',wm==='trous'?'Dernier trou → bord droit de l’œuvre 1':wm==='entraxe'?'Largeur de l’œuvre':'Largeur du mur',wm==='trous'?'Ex. 7':wm==='entraxe'?'Ex. 100':'Ex. 600')+
 rfCalcInput('w2',wm==='trous'?'Écart entre les deux œuvres':wm==='entraxe'?'Bord gauche → attache gauche':'Largeurs des œuvres (séparées par +)',wm==='trous'?'Ex. 15':wm==='entraxe'?'Ex. 5':'Ex. 80 + 100 + 60',wm==='espaces'?'text':'decimal')+

 '<div class="calc-result" aria-live="polite"><small>Résultat horizontal</small><div id="rf-w-result" class="calc-value">— cm</div><div id="rf-w-label" class="calc-label">Entre tes mesures.</div></div>'+ 
 '<div class="calc-formula-box"><div class="calc-formula-heading">Formule utilisée</div><span class="calc-formula">'+wFormula+'</span><div id="rf-w-sub" class="calc-substitution"></div><div class="calc-explain">'+(wm==='trous'?'Dernière attache → bord droit + écart entre cadres + bord gauche → première attache.':wm==='entraxe'?'Largeur de l’œuvre moins les deux retraits des attaches.':'M = largeur du mur ; ΣL = somme des largeurs des œuvres ; N = nombre d’œuvres.')+'</div></div>'+

function rfCalcUpdate(){

 for(const which of ['h','w']){
  const r=which==='h'?rfCalcHeight():rfCalcWidth();
  const value=out.querySelector('#rf-'+which+'-result'),label=out.querySelector('#rf-'+which+'-label'),sub=out.querySelector('#rf-'+which+'-sub'),button=out.querySelector('#rf-copy-'+which);
  if(!value||!label||!sub||!button)continue;
  value.textContent=r.value===null?'— cm':rfF(which==='h'&&rfCalc.hMode==='decalage'?Math.abs(r.value):r.value)+' cm';
  label.textContent=r.value===null?r.error:r.label;
  sub.textContent=r.value===null?'':r.sub;
  button.disabled=r.value===null;
 }
}

root.addEventListener('click',e=>{const tab=e.target.closest('[data-tab]');if(tab){s.tab=tab.dataset.tab;if(s.tab!=='drill')s.siteMode=false;draw();return}const b=e.target.closest('button[data-act]');if(!b)return;const act=b.dataset.act;

if(['plan','works','attach','drill'].includes(act)){s.tab=act;s.siteMode=false;draw();return}if(act==='toggleCenter'){s.centerOpen=!s.centerOpen;draw();return}if(act==='toggleBottom'){s.bottomOpen=!s.bottomOpen;draw();return}if(act==='applyBottom'){const input=out.querySelector('[data-bottom-height]');const raw=input?.value?.trim()||'';const n=Number(raw);const scope=out.querySelector('input[name="bottomScope"]:checked')?.value||s.bottomScope;if(!raw||!Number.isFinite(n)||n<0||n>s.wallH){alert('Indique une hauteur comprise entre 0 et '+f(s.wallH)+' cm.');return}const aa=scope==='all'?s.arts:[art()].filter(Boolean);if(!aa.length){alert('Aucune œuvre sélectionnée.');return}const impossible=aa.filter(a=>n+a.h>s.wallH+0.00001);if(impossible.length){alert('Hauteur impossible pour '+impossible.map(a=>a.name).join(', ')+' : les œuvres doivent rester dans le mur.');return}s.bottomHeight=n;s.bottomScope=scope;for(const a of aa)a.y=s.wallH-n-a.h;draw();return}if(act==='applyCenter'){const input=out.querySelector('[data-center-height]');const raw=input?.value?.trim()||'';const n=Number(raw);const scope=out.querySelector('input[name="centerScope"]:checked')?.value||s.centerScope;if(!raw||!Number.isFinite(n)||n<0||n>s.wallH){alert('Indique une hauteur comprise entre 0 et '+f(s.wallH)+' cm.');return}const aa=scope==='all'?s.arts:[art()].filter(Boolean);if(!aa.length){alert('Aucune œuvre sélectionnée.');return}const impossible=aa.filter(a=>n<a.h/2-0.00001||n>s.wallH-a.h/2+0.00001);if(impossible.length){alert('Hauteur impossible pour '+impossible.map(a=>a.name).join(', ')+' : les œuvres doivent rester dans le mur.');return}s.centerHeight=n;s.centerScope=scope;for(const a of aa)a.y=s.wallH-n-a.h/2;draw();return}if(act==='toggleGap'){s.gapOpen=!s.gapOpen;draw();return}if(act==='toggleHeight'){s.heightOpen=!s.heightOpen;draw();return}if(act==='select'){s.selected=Number(b.dataset.id);s.deleteId=null;draw();return}if(act==='askDelete'){s.deleteId=Number(b.dataset.id);draw();return}if(act==='cancelDelete'){s.deleteId=null;draw();return}if(act==='confirmDelete'){const id=Number(b.dataset.id);if(id!==s.deleteId)return;s.arts=s.arts.filter(a=>a.id!==id);if(s.selected===id)s.selected=s.arts[0]?.id??null;s.deleteId=null;draw();return}if(act==='add'){const id=Math.max(0,...s.arts.map(a=>a.id))+1;s.arts.push({id,name:'Œuvre '+id,w:50,h:75,x:Math.max(0,Math.min(40*id,s.wallW-50)),y:90,edge:10,top:8,points:2});s.selected=id;s.tab='works';s.deleteId=null;draw();return}if(act==='equal'){if(!s.arts.length){alert('Ajoute d’abord une œuvre sur ce mur depuis l’onglet Œuvres.');return}const aa=[...s.arts].sort((a,b)=>a.x-b.x),total=aa.reduce((v,a)=>v+a.w,0);if(total>=s.wallW){alert('Le total des largeurs dépasse le mur.');return}const gap=(s.wallW-total)/(aa.length+1);let x=gap;for(const a of aa){a.x=x;x+=a.w+gap}draw();return}if(act==='applyGap'){const input=out.querySelector('[data-key="desiredGap"]'),n=Number(input?.value);if(!input||input.value.trim()===''||!Number.isFinite(n)||n<0){alert('Indique un écart positif ou nul.');return}s.desiredGap=n;applyGap(n);draw();return}if(act==='presetGap'){const n=Number(b.dataset.id);s.desiredGap=n;applyGap(n);draw();return}if(['center','top','bottom'].includes(act)){const a=art();if(!a)return;const ref=act==='center'?a.y+a.h/2:act==='top'?a.y:a.y+a.h;for(const v of s.arts){v.y=Math.max(0,Math.min(s.wallH-v.h,act==='center'?ref-v.h/2:act==='top'?ref:ref-v.h))}draw();return}if(act==='removePhoto'){const a=s.arts.find(z=>z.id===Number(b.dataset.id));if(a){delete a.photo;draw()}return}if(act==='points'){const a=art();if(a){const raw=b.dataset.id;a.points=raw==='rail'?'rail':Number(raw);if(a.points===4&&a.bottomOffset===undefined)a.bottomOffset=''}draw()}});
root.addEventListener('keydown',e=>{if(e.target?.id!=='gap-direct-input')return;if(e.key==='Enter'){e.preventDefault();out.querySelector('[data-act=saveGap]')?.click();}else if(e.key==='Escape'){e.preventDefault();out.querySelector('[data-act=cancelGap]')?.click();}});

 }if(e.target?.id==='wall-choice'){chooseWall(e.target.value);return;}const ai=s.importedPlan?.analysis;if(ai&&Array.isArray(ai.candidates)){
 const ck=e.target.closest('input[data-candidate-check]');if(ck){const c=ai.candidates[Number(ck.dataset.candidateCheck)];if(c){c.checked=ck.checked;recognitionError='';pwaSave();}return;}
 const inp=e.target.closest('input[data-candidate-cm]');if(inp){const c=ai.candidates[Number(inp.dataset.candidateCm)];if(c){c.cm=inp.value.trim()===''?'':Number(inp.value.replace(',','.'));recognitionError='';pwaSave();}return;}
 }const refInput=e.target.closest('input[type="file"][data-import-plan]');if(refInput){importPlanFile(refInput.files?.[0],refInput.dataset.importPlan);return;}const photoInput=e.target.closest('input[type="file"][data-photo]');if(photoInput){const file=photoInput.files?.[0];const id=Number(photoInput.dataset.photo);if(!file)return;if(!file.type.startsWith('image/')&&!/\.(heic|heif|jpg|jpeg|png|webp)$/i.test(file.name)){alert('Choisis une image.');return}const reader=new FileReader();reader.onload=()=>{const a=s.arts.find(z=>z.id===id);if(!a)return;const data=reader.result;const img=new Image();img.onload=()=>{try{const max=1200,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(img.naturalWidth*scale));cv.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=cv.getContext('2d');ctx.fillStyle='#f4f0e7';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);a.photo=cv.toDataURL('image/jpeg',0.85)}catch(e){a.photo=data}draw()};img.onerror=()=>{a.photo=data;draw()};img.src=data};reader.readAsDataURL(file);return}if(e.target.matches('input[name="centerScope"]')){s.centerScope=e.target.value;pwaSave();return}if(e.target.matches('input[name="bottomScope"]')){s.bottomScope=e.target.value;pwaSave();return}const input=e.target.closest('input[data-key]');if(!input)return;const key=input.dataset.key;if(key==='desiredGap'){const n=Number(input.value);if(input.value.trim()!==''&&Number.isFinite(n)&&n>=0)s.desiredGap=n;pwaSave();return}const n=Number(input.value);if(!Number.isFinite(n))return;if(s.tab==='attach'&&(key==='top'||key==='edge'||key==='bottomOffset')){const a=art();if(a){a[key]=key==='bottomOffset'&&input.value.trim()===''?'':Math.max(0,n);if(key==='edge')a.edge=Math.min(a.edge,a.w/2);draw()}return}if(key==='wallW'||key==='wallH'){s[key]=Math.max(50,n);for(const a of s.arts)cap(a)}else{const a=art();if(!a)return;a[key]=['w','h'].includes(key)?Math.max(1,n):Math.max(0,n);cap(a)}draw()});pwaStart();
